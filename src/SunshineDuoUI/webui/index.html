<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>萌远控 Duo</title>
<style>
/* 图标统一用仓库自带的 Font Awesome 6 Solid，仅 logo 保留图片 */
@font-face{font-family:"FA Solid";src:url("fa-solid-900.woff2") format("woff2");
  font-weight:900;font-style:normal;font-display:block}
.fi{font-family:"FA Solid";font-weight:900;font-style:normal;display:inline-flex;align-items:center;
  justify-content:center;line-height:1;font-size:14px;user-select:none;-webkit-user-select:none}
/* ===================== Fluent 2 / WinUI 3 设计令牌 ===================== */
:root{
  --font-ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  --font-mono:"Cascadia Mono","Consolas",monospace;
  --r-win:10px; --r-card:8px; --r-ctl:4px;
  --ease:cubic-bezier(0,0,0,1); --dur:.167s;
  /* ToggleSwitch 令牌（WinUIonWeb theme.css） */
  --toggle-border:rgba(0,0,0,.45); --toggle-thumb:rgba(0,0,0,.61);
  --toggle-on-thumb:#FFFFFF; --toggle-thumb-hover:rgba(0,0,0,.89);
  --fast-duration:100ms; --fast-out-slow-in:cubic-bezier(0,0,0,1);
}
html[data-theme="light"]{
  color-scheme:light;
  --text-primary:rgba(0,0,0,.89);
  --bg:#F3F3F3; --pane:#F7F7F7; --card:#FFFFFF; --card2:#F9F9F9;
  --stroke:rgba(0,0,0,.06); --stroke-2:rgba(0,0,0,.12);
  --text:rgba(0,0,0,.89); --muted:rgba(0,0,0,.62); --faint:rgba(0,0,0,.45);
  --fill:rgba(255,255,255,.70); --fill-hover:rgba(249,249,249,.50);
  --ctrl:#FFFFFF; --subtle:rgba(0,0,0,.0373); --subtle-2:rgba(0,0,0,.0241); --press:rgba(0,0,0,.06);
  --accent:#15803D; --accent-hover:#16A34A; --accent-press:#12632F;
  --accent-soft:rgba(21,128,61,.09); --on-accent:#FFFFFF; --accent-text:#15803D;
  --danger:#C42B1C; --warn:#9D5D00;
  --shadow:0 8px 26px rgba(0,0,0,.11),0 2px 6px rgba(0,0,0,.05);
  --hair:rgba(0,0,0,.06);
  --win-line:rgba(0,0,0,.10);
  --wbtn-hover:rgba(0,0,0,.06); --wbtn-press:rgba(0,0,0,.10);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --text-primary:rgba(255,255,255,.89);
  --toggle-border:rgba(255,255,255,.54); --toggle-thumb:rgba(255,255,255,.79);
  --toggle-on-thumb:#000000; --toggle-thumb-hover:#FFFFFF;
  --bg:#202020; --pane:#252525; --card:#2B2B2B; --card2:#303030;
  --stroke:rgba(255,255,255,.08); --stroke-2:rgba(255,255,255,.16);
  --text:rgba(255,255,255,.89); --muted:rgba(255,255,255,.61); --faint:rgba(255,255,255,.42);
  --fill:rgba(255,255,255,.06); --fill-hover:rgba(255,255,255,.09);
  --ctrl:#242424; --subtle:rgba(255,255,255,.06); --subtle-2:rgba(255,255,255,.04); --press:rgba(255,255,255,.10);
  --accent:#1D9A50; --accent-hover:#22B45C; --accent-press:#17803F;
  --accent-soft:rgba(34,197,94,.12); --on-accent:#FFFFFF; --accent-text:#4ADE80;
  --danger:#F1707B; --warn:#E8A317;
  --shadow:0 14px 38px rgba(0,0,0,.52),0 2px 8px rgba(0,0,0,.36);
  --hair:rgba(255,255,255,.07);
  --win-line:rgba(255,255,255,.16);
  --wbtn-hover:rgba(255,255,255,.12); --wbtn-press:rgba(255,255,255,.16);
}

/* ===================== 去浏览器化基础 ===================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui);font-size:14px;line-height:1.45;color:var(--text);
  background:#0a0c0f;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;cursor:default;overflow:hidden;
}
button,input{font:inherit;color:inherit;outline:none;background:none;border:0}
input{cursor:text;user-select:text;-webkit-user-select:text}
img,svg{-webkit-user-drag:none;user-select:none}
::selection{background:var(--accent-soft)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.drag{-webkit-app-region:drag;app-region:drag}
.nodrag{-webkit-app-region:no-drag;app-region:no-drag}
html.notrans *{transition:none !important}

/* ===================== 预览舞台 ===================== */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:
    radial-gradient(900px 620px at 20% 6%,rgba(34,197,94,.10),transparent 62%),
    radial-gradient(1100px 760px at 82% 96%,rgba(70,130,240,.09),transparent 60%),
    linear-gradient(158deg,#131720,#0a0c10 55%,#07080a);
}
.stage-note{font-size:11.5px;color:#69727f;text-align:center;letter-spacing:.01em}
.stage-note b{color:#9aa4b2;font-weight:600}
.reopen{display:none;height:32px;padding:0 16px;border-radius:var(--r-ctl);background:var(--card);
  border:1px solid var(--stroke);color:var(--text);font-size:13px;cursor:default}
.reopen:hover{background:var(--fill-hover)}
.stage.closed .app{display:none}
.stage.closed .reopen{display:inline-flex;align-items:center}

/* ===================== 窗口外壳 ===================== */
.app{position:relative;width:1020px;height:680px;flex:none;display:grid;grid-template-columns:236px 1fr;
  background:var(--bg);border-radius:var(--r-win);box-shadow:inset 0 0 0 1px var(--stroke),var(--shadow);
  overflow:hidden;transform:scale(var(--fit,1));transform-origin:center;
  transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.app.min{transform:scale(calc(var(--fit,1) * .94));opacity:0}

/* ===================== NavigationView 风格侧栏 ===================== */
.sidebar{background:var(--pane);border-right:1px solid var(--stroke);
  padding:20px 12px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:12px;padding-left:12px}
.logo{width:40px;height:40px;flex:none;display:grid;place-items:center}
.logo .fi{font-size:20px}
.logo img{width:100%;height:100%;object-fit:contain}
.brand-name{font-family:var(--font-display);font-size:15px;font-weight:600;line-height:1.2}
.brand-sub{font-size:12px;color:var(--muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;
  border-radius:var(--r-ctl);font-size:15px;font-weight:400;color:var(--text);text-align:left;width:100%;
  transition:background var(--dur) var(--ease)}
.nav-item:focus-visible{outline:2px solid var(--text-primary);outline-offset:-2px}
.nav-item .fi{font-size:18px;color:var(--muted);transition:color var(--dur) var(--ease)}
.nav-item:hover{background:var(--subtle-2)}
.nav-item:active{background:var(--subtle)}
.nav-item.on{background:var(--subtle)}
.nav-item.on .fi{color:var(--accent-text)}
.nav-item.on::after{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:16px;border-radius:2px;background:var(--accent)}
.nav-item .pill{margin-left:auto;height:20px;padding:0 8px;font-size:11px;border-radius:10px;gap:5px;font-weight:400}
.nav-item .pill i{width:6px;height:6px}
.side-foot{margin-top:auto;padding:0 12px}
.hair{height:1px;background:var(--hair);margin-bottom:12px}
.svc{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-height:20px}
.svc .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--dotc,var(--muted)) 16%,transparent)}
.svc.ok .dot{background:var(--accent-text);--dotc:var(--accent-text)}
.svc.warn .dot{background:var(--warn);--dotc:var(--warn)}
.svc.bad .dot{background:var(--danger);--dotc:var(--danger)}
.svc .fi{font-size:14px;color:var(--faint);margin-left:auto}

/* ===================== 内容区 ===================== */
.content{position:relative;overflow-y:scroll;overflow-x:hidden;padding:0 24px}
.content::-webkit-scrollbar,.res::-webkit-scrollbar{width:10px;height:10px;background:transparent}
.content::-webkit-scrollbar-track,.res::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-button,.res::-webkit-scrollbar-button{display:none;width:0;height:0}
.content::-webkit-scrollbar-corner,.res::-webkit-scrollbar-corner{background:transparent}
.content::-webkit-scrollbar-thumb,.res::-webkit-scrollbar-thumb{
  background:transparent;border:3px solid transparent;background-clip:content-box;border-radius:99px;min-height:32px}
.content.scrolling::-webkit-scrollbar-thumb,.res.scrolling::-webkit-scrollbar-thumb{background:var(--stroke-2)}
.content.scrolling::-webkit-scrollbar-thumb:hover,.res.scrolling::-webkit-scrollbar-thumb:hover{
  background:var(--muted);border:2px solid transparent;background-clip:content-box}
.page{display:none;padding:20px 0 24px}
.page.on{display:block;animation:pageIn .18s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:flex-start;gap:16px;margin-bottom:14px;padding-right:92px;
  position:sticky;top:0;z-index:5;background:var(--bg);padding-top:20px;padding-bottom:32px;
  box-shadow:0 1px 0 var(--hair),0 10px 16px -12px var(--shadow)}
.h1{font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.sub{font-size:14px;color:var(--muted);margin-top:5px}
.h2{font-size:16px;font-weight:600;line-height:1.3}
.sec{margin-top:20px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.sec-h .right{margin-left:auto;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--faint);line-height:1.6;margin-top:14px}
.divider{height:1px;background:var(--hair);margin:20px 0}

/* 窗口控件：WinUI caption button */
.winctl{position:absolute;top:0;right:0;z-index:8;display:flex}
.wbtn{width:46px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:0;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.wbtn .fi{font-size:13px}
.wbtn:hover{background:var(--wbtn-hover);color:var(--text)}
.wbtn:active{background:var(--wbtn-press)}
.wbtn.theme{width:38px;color:var(--faint)}
.wbtn.theme.on{color:var(--accent-text);background:var(--accent-soft)}
.wbtn.x:hover{background:#C42B1C;color:#fff}

/* InfoBadge 状态胶囊 */
.pill{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:12px;
  font-size:12px;font-weight:400;flex:none;--pc:var(--muted);
  background:color-mix(in srgb,var(--pc) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--pc) 34%,transparent);color:var(--pc)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--pc);flex:none}
.pill.ok{--pc:var(--accent-text)} .pill.bad{--pc:var(--danger)} .pill.wait{--pc:var(--warn)}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r-card);padding:16px;
  transition:background var(--dur) var(--ease)}
.card-t{font-size:14px;font-weight:600;white-space:nowrap}
.card-d{font-size:12px;color:var(--muted);line-height:1.55;margin-top:4px}
.card-top{display:flex;align-items:center;gap:6px;min-height:22px}
.card-top .btn{margin-left:auto}
.card-top .btn-icn:first-of-type{margin-left:auto}
.card-top .btn.sm{padding:0 8px;font-size:12px}
.val{font-family:var(--font-mono);font-size:18px;font-weight:600;letter-spacing:.005em;
  margin-top:11px;user-select:text;-webkit-user-select:text;white-space:nowrap}
.card-top+.val{margin-top:9px}
.status{font-size:12px;color:var(--muted);min-height:17px;margin-top:10px;line-height:1.5}
.status.ok{color:var(--accent-text)} .status.bad{color:var(--danger)} .status.warn{color:var(--warn)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols>div{display:flex;flex-direction:column;gap:16px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;
  border-radius:var(--r-ctl);background:var(--fill);border:1px solid var(--stroke);color:var(--text);
  font-size:14px;white-space:nowrap;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform 80ms var(--ease)}
.btn:hover{background:var(--fill-hover);border-color:var(--stroke-2)}
.btn:active{background:var(--press);transform:scale(.99)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .fi{font-size:14px;color:var(--muted)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600}
.btn.pri:hover{background:var(--accent-hover);border-color:transparent}
.btn.pri:active{background:var(--accent-press)}
.btn.pri .fi{color:var(--on-accent)}
.btn.sm{height:26px;padding:0 8px;font-size:12px;border-radius:var(--r-ctl)}
.btn.lg{height:36px;padding:0 20px;font-size:14px}
.btn-icn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  padding:0;border-radius:var(--r-ctl);background:var(--fill);border:1px solid var(--stroke);
  font-family:"FA Solid";font-weight:900;font-size:13px;color:var(--muted);
  cursor:pointer;transition:background var(--dur) var(--ease),color var(--dur) var(--ease),
  transform var(--dur) var(--ease)}
.btn-icn:hover{background:var(--fill-hover);color:var(--text)}
.btn-icn[data-a="wan"]:hover{transform:rotate(120deg)}
.btn.blk{width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn .fi{transition:transform var(--dur) var(--ease)}

/* TextBox */
.field{display:block}
.field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.input{width:100%;height:32px;padding:0 10px;border-radius:var(--r-ctl);background:var(--ctrl);
  border:1px solid var(--stroke);border-bottom-color:var(--stroke-2);font-size:14px;
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.input:hover{border-color:var(--stroke-2)}
.input:focus{border-color:var(--stroke);box-shadow:inset 0 -2px 0 var(--accent)}
.input.mono{font-family:var(--font-mono);letter-spacing:.02em}
.input::placeholder{color:var(--faint)}

/* ToggleSwitch */
.sw{appearance:none;-webkit-appearance:none;display:flex;align-items:center;gap:14px;width:100%;
  min-height:36px;text-align:left;background:none;border:0;font:inherit;color:inherit;padding:0;cursor:pointer}
.sw-t{font-size:14px}
.sw-d{font-size:12px;color:var(--muted);margin-top:2px;display:block}
.sw .win-switch{margin-left:auto;flex:none;position:relative;display:inline-flex;align-items:center;
  --tx:0px;width:40px;height:20px;border-radius:10px;touch-action:none}
.sw .win-switch .track{position:absolute;inset:0;border-radius:10px;border:1px solid var(--toggle-border);
  background:var(--subtle);transition:all var(--fast-duration) var(--fast-out-slow-in)}
.sw:hover .win-switch .track{border-color:var(--text-primary);background:var(--subtle-2)}
.sw .win-switch .knob{position:absolute;top:0;left:0;width:20px;height:20px;
  transform:translateX(var(--tx));transition:transform var(--fast-duration) var(--fast-out-slow-in)}
.sw .win-switch .thumb{position:absolute;top:50%;left:50%;width:12px;height:12px;border-radius:6px;
  background:var(--toggle-thumb);transform:translate(-50%,-50%) translateX(-.5px);
  transition:width var(--fast-duration) var(--fast-out-slow-in),height var(--fast-duration) var(--fast-out-slow-in),
  background var(--fast-duration) var(--fast-out-slow-in)}
.sw:hover .win-switch .thumb{width:14px;height:14px;border-radius:7px;background:var(--toggle-thumb-hover)}
.sw .win-switch.is-on .track{background:var(--accent);border-color:transparent}
.sw:hover .win-switch.is-on .track{background:var(--accent-hover)}
.sw .win-switch.is-on .thumb{background:var(--toggle-on-thumb)}
.sw:hover .win-switch.is-on .thumb{background:var(--toggle-on-thumb)}
.sw .win-switch.is-pressed .knob,.sw .win-switch.dragging .knob{transition:none}
.sw .win-switch.is-pressed:not(.is-on) .thumb,.sw .win-switch.dragging:not(.is-on) .thumb{
  width:17px;height:14px;border-radius:7px;background:var(--toggle-thumb-hover);
  transform:translate(-50%,-50%) translateX(1.5px);transition:none}
.sw .win-switch.is-pressed.is-on .thumb,.sw .win-switch.dragging.is-on .thumb{
  width:17px;height:14px;border-radius:7px;background:var(--toggle-on-thumb);
  transform:translate(-50%,-50%) translateX(-1.5px);transition:none}
.sw .win-switch.is-pressed:not(.is-on) .track,.sw .win-switch.dragging:not(.is-on) .track{
  border-color:var(--toggle-border);background:var(--press)}
.sw .win-switch.is-pressed.is-on .track,.sw .win-switch.dragging.is-on .track{background:var(--accent-press)}
.sw:focus-visible{outline:2px solid var(--text-primary);outline-offset:2px}

/* SelectorBar / 主题切换 */
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:6px;background:var(--fill);border:1px solid var(--stroke)}
.seg button{height:26px;padding:0 12px;border-radius:var(--r-ctl);font-size:12px;color:var(--muted);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.seg button:hover{color:var(--text);background:var(--fill-hover)}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg button.on:hover{background:var(--accent-hover)}

/* 模式选择卡片 */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{padding:18px 14px 16px;border-radius:var(--r-card);background:var(--card);border:1px solid var(--stroke);
  text-align:center;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.mode .mode-ic{position:relative;display:inline-flex;width:40px;height:40px;margin:0 auto 12px;align-items:center;justify-content:center;color:var(--muted);transition:color var(--dur) var(--ease)}
.mode .mode-ic>.fi:not(.mode-badge){font-size:40px;width:40px;height:40px}
.mode .mode-ic>.mode-badge{position:absolute;right:-12px;bottom:-6px;font-size:15px;width:26px;height:26px;
  display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  background:var(--card);border:2px solid var(--accent-text);color:var(--accent-text)}
.mode b{display:block;font-size:14px;font-weight:600}
.mode span:not(.fi){display:block;font-size:12px;color:var(--muted);line-height:1.55;margin-top:6px}
.mode:hover{background:var(--card2)}
.mode:active{transform:scale(.995)}
.mode.on{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mode.on .mode-ic,.mode.on .mode-ic>.fi,.mode.on b{color:var(--accent-text)}

/* 地址条 */
.addr{display:flex;align-items:center;gap:16px;padding:14px 16px;margin-top:12px}
.addr .k{font-size:12px;color:var(--muted)}
.addr .addr-row{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.addr .addr-row .seg{margin-top:0}
.addr .addr-row .v{margin-top:0}
.addr .v{font-family:var(--font-mono);font-size:18px;font-weight:600;margin-top:3px;
  user-select:text;-webkit-user-select:text}
.addr .btn{margin-left:auto}
.addr .btn-icn{margin-left:auto}

/* PIN */
.pairrow{display:flex;align-items:center;gap:18px;margin-top:14px}
.pairrow .btn{height:56px;padding:0 22px}
.pin{display:flex;gap:10px}
.pin input{width:56px;height:56px;text-align:center;border-radius:6px;background:var(--ctrl);
  border:1px solid var(--stroke);border-bottom-color:var(--stroke-2);font-family:var(--font-mono);
  font-size:24px;font-weight:600;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background var(--dur)}
.pin input:hover{border-color:var(--stroke-2)}
.pin input:focus{border-color:var(--stroke);box-shadow:inset 0 -2px 0 var(--accent)}
.pin input.has{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}

/* ListView 分辨率 */
.res{border:1px solid var(--stroke);border-radius:var(--r-card);overflow:hidden;background:var(--card);
  max-height:252px;overflow-y:auto}
.res-row{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;

/* 图标一律用 Font Awesome 6 Solid 字形；映射值取自仓库内 fa-solid-900.ttf 的 cmap */
const ICON={
  monitor:"",gamepad:"",stack:"",gear:"",info:"",
  display:"",clone:"",eye:"",expand:"",lock:"",

  min:"",x:"",check:"",

};
const ic=(n,cls="")=>`<span class="fi ${cls}" aria-hidden="true">${ICON[n]||""}</span>`;
const THEME_ICON={

/* ===================== 宿主 RPC ===================== */
const HOSTED=!!(window.chrome&&window.chrome.webview);
if(HOSTED)document.documentElement.classList.add("hosted");
let rpcSeq=0;
const RPC=new Map();
function call(method,args={}){
  if(!HOSTED)return Promise.reject(new Error("预览模式无宿主"));
  return new Promise((ok,fail)=>{
    const id=++rpcSeq;
    RPC.set(id,{ok,fail});
    window.chrome.webview.postMessage({id,method,args});
  });
}
async function remote(method,args){
  try{return await call(method,args);}catch(e){toast(e.message,false);throw e;}
}
if(HOSTED){
  window.addEventListener("error",e=>call("log",{message:"UI error: "+e.message}));
  window.addEventListener("unhandledrejection",e=>call("log",{message:"UI reject: "+(e.reason&&e.reason.message||e.reason)}));
  window.__sdReply=m=>{
    const p=RPC.get(m.id);
    if(!p)return;
    RPC.delete(m.id);
    m.ok?p.ok(m.result):p.fail(new Error(m.error||"调用失败"));
  };
  window.__sdEvent=m=>onEvent(m.event,m.data);
  window.chrome.webview.addEventListener("message",e=>{
    const m=e.data;
    if(!m)return;
    if(m.id!==undefined&&m.method===undefined)window.__sdReply(m);
    else if(m.event)window.__sdEvent(m);
  });
}

function applySnapshot(s){
  state={...state,...s,
    net:{...state.net,...(s.net||{})},
    sessions:{...state.sessions,...(s.sessions||{})},
    core:{...state.core,...(s.core||{})},
    vda:{...state.vda,...(s.vda||{})}};
  if(s.sessions)for(const x of Object.values(s.sessions))state.sessions[x.id]=x;
  render();
  applyTheme(state.theme);
  if(s.page)navigate(s.page);
  if(s.focusPin){const f=document.querySelector("#pin-console input");if(f)f.focus();}
  if(s.consoleEnabled===false||s.gameEnabled===false){
    $$('.nav-item').forEach(b=>{
      if((s.consoleEnabled===false&&["console","vda"].includes(b.dataset.nav))||
         (s.gameEnabled===false&&b.dataset.nav==="game")) b.style.display="none";
    });
    if(s.consoleEnabled===false){const el=$("#p-c");if(el)el.closest(".field").style.display="none";}
    if(s.gameEnabled===false){const el=$("#p-g");if(el)el.closest(".field").style.display="none";}
    $$('[data-a="restart"]').forEach(b=>{
      const id=b.dataset.id;
      if((id==="console"&&s.consoleEnabled===false)||(id==="game"&&s.gameEnabled===false))b.style.display="none";
    });
  }
}

function onEvent(name,data){
  if(name==="session"){
    for(const [id,up] of Object.entries(data||{})){
      const pill=$("#pill-"+id);
      if(!pill)continue;
      pill.className="pill nodrag "+(up===true?"ok":up===false?"bad":"wait");
      $("#pillText-"+id).textContent=up===true?"运行中":up===false?"未运行":"检测中";
    }
    return;
  }
  if(name==="service"){state.core.service=data;renderService();return;}
  if(name==="tunnel"){applyTunnel(data||{});return;}
  if(name==="wan"){
    state.net.wan=data;
    if(tunnelOn())return;
    $$('.val[id^="v-wan-"]').forEach(el=>{el.textContent=data});
    return;
  }
  if(name==="navigate"){navigate(data);return;}
  if(name==="focusPair"){
    navigate("console");
    const first=document.querySelector("#pin-console input");
    if(first)first.focus();
    return;
  }
  if(name==="theme"){applyTheme(data);return;}
}

async function pollRemote(){
  while(HOSTED){
    await wait(2500);
    try{
      const s=await call("poll");
      onEvent("session",s.sessions);
      onEvent("service",s.service);
      if(s.wan)onEvent("wan",s.wan);
    }catch{}
  }
}

const SIZE_RE=/^(\d+)x(\d+)/;
const lightMQ=matchMedia("(prefers-color-scheme: light)");

function navigate(id){
  state.page=id;
  $$(".nav-item").forEach(b=>b.classList.toggle("on",b.dataset.nav===id));

const resolveTheme=m=>m==="light"?"light":m==="dark"?"dark":(lightMQ.matches?"light":"dark");
function applyTheme(mode){
  state.theme=mode;
  if(!HOSTED&&!THEME_PARAM)localStorage.setItem("sd.theme",mode);
  const root=document.documentElement;
  root.classList.add("notrans");
  root.dataset.theme=resolveTheme(mode);
  void root.offsetHeight;
  requestAnimationFrame(()=>root.classList.remove("notrans"));
  /* 页面隐藏时 rAF 不会触发（WebView2 最小化也是），补一个定时器兜底 */
  setTimeout(()=>root.classList.remove("notrans"),120);
  const btn=$("#themeBtn");
  if(btn){
    const cur=THEME_ICON[mode]||THEME_ICON.system;
    btn.innerHTML=ic(cur.icon);
    btn.setAttribute("aria-label",cur.label);
    btn.title=cur.label;
  }
}

function toast(text,ok=true){
  $("#toastIcon").innerHTML=ic(ok?"check":"info");
  $("#toastText").textContent=text;
  const t=$("#toast");
  t.classList.toggle("err",!ok);
  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove("on"),1900);
}

function setStatus(el,text,kind){

function patchWanCards(){
  const on=tunnelOn(), vip=state.tunnel.virtualIp||"";
  for(const id of ["console","game"]){
    const t=$("#t-v-wan-"+id), h=$("#h-v-wan-"+id), v=$("#v-wan-"+id), b=$("#b-wan-v-wan-"+id);
    if(!t||!v)continue;
    if(on){
      t.textContent="虚拟 IP";
      if(h)h.style.display="none";
      v.textContent=vip||"等待连接…";
      if(b)b.style.display="none";
    }else{
      t.textContent="公网 IP";
      if(h){h.style.display="";h.textContent="ip.sb 实时获取 · 5 分钟缓存";}
      v.textContent=state.net.wan;
      if(b)b.style.display="";
    }
    const wseg=document.querySelector('[data-a="addr-mode"][data-mode="wan"][data-sid="'+id+'"]');
    if(wseg){
      wseg.textContent=tunnelOn()?"内网穿透":"公网";
      const av=$("#v-addr-"+id), ses=state.sessions[id];
      if(av&&ses&&(state.addrMode[id]||"lan")==="wan")av.textContent=addrValue(id);
    }

function renderTunnel(){
  const t=state.tunnel, navPill=$("#pill-tunnel");
  if(navPill)navPill.style.display=t.running?"":"none";
  const vip=$("#etVip");
  if(vip)vip.textContent=t.virtualIp||(t.running?"等待分配…":"—");
  const srv=$("#etServer");
  if(srv){
    const v=t.serverMode==="custom"?(t.peers&&t.peers.length?t.peers.join("，"):"（未填写节点地址）"):(t.defaultServer||"");
    srv.textContent=v||"—";
    srv.style.color=t.running?"":"var(--muted)";
  }
  const sw=document.querySelector('.sw[data-key="etEnabled"]');
  if(sw){
    const on=sw.getAttribute("aria-checked")==="true";
    if(on!==!!t.enabled){sw.setAttribute("aria-checked",String(!!t.enabled));swSetVisual(sw,t.enabled?SW_MAX_TX:SW_MIN_TX,!!t.enabled,"is-on");}
  }
  const secret=$("#etSecret");
  if(secret&&!secret.value)secret.placeholder=t.secretSet?"已设置，留空不修改":"留空为无密钥";
  patchWanCards();
}
function splitPeers(v){return String(v||"").split(/[,，;；\s]+/).map(x=>x.trim()).filter(Boolean);}
function segVal(id,def){const b=document.querySelector("#"+id+" button.on");return b?b.dataset.v:def;}
async function etApply(enabled){
  const st=$("#etStatus");
  const adv=($("#etAdv")&&$("#etAdv").style.display!=="none");
  const network=($("#etNet").value||"").trim();
  const peers=adv?splitPeers($("#etPeers")?.value||""):[];
  const serverMode=adv?segVal("etServerSeg","public"):"public";
  const ipMode=adv?segVal("etIpSeg","dhcp"):"dhcp";
  const ipv4=ipMode==="manual"?(($("#etIpv4")?.value||"").trim()):"";
  if(adv&&serverMode==="custom"&&!peers.length){setStatus(st,"「指定」需填写节点地址。","warn");return;}
  if(adv&&ipMode==="manual"&&!ipv4){setStatus(st,"手动模式需填写虚拟 IP。","bad");return;}
  setStatus(st,"正在应用…","");
  if(HOSTED){
    try{
      const payload={enabled,network};
      const sec=$("#etSecret").value;if(sec)payload.secret=sec;
      if(adv){
        payload.server_mode=serverMode;payload.peers=peers;payload.ipv4=ipv4;
        payload.tcp_hole_punch=($("#etTcp")?.getAttribute("aria-checked")==="true");
      }
      const r=await call("easytierSet",payload);
      applyTunnel(r.state||{});
      setStatus(st,r.message,r.failed?"bad":"ok");
    }catch(e){
      setStatus(st,"应用失败："+e.message,"bad");
      const sw=document.querySelector('.sw[data-key="etEnabled"]');
      if(sw){sw.setAttribute("aria-checked",String(!enabled));swSetVisual(sw,!enabled?SW_MAX_TX:SW_MIN_TX,!enabled,"is-on");}
    }
    return;
  }
  await wait(800);
  state.tunnel.enabled=enabled;state.tunnel.network=network;state.tunnel.running=enabled;
  renderTunnel();
  setStatus(st,enabled?"内网穿透已启动。":"内网穿透已停止。","ok");
}

function resRows(){
  const {list,sel,aw,ah}=state.vda, box=$("#resList");
  if(!list.length){box.innerHTML='<div class="empty">列表为空，先在右侧添加一条分辨率。</div>';return;}
  const firstMatch=list.findIndex(r=>{
    const m=SIZE_RE.exec(r);
    return m&&+m[1]===aw&&+m[2]===ah;
  });
  box.innerHTML=list.map((r,i)=>{
    return `<div class="res-row${i===sel?" sel":""}" data-a="res-pick" data-i="${i}">`
      +`<span class="idx">${i+1}</span><span>${esc(r)}</span>${i===firstMatch?'<span class="tag">当前活动</span>':""}</div>`;
  }).join("");
}

async function copyText(v){
  if(HOSTED){await call("copyText",{text:v});return;}
  try{await navigator.clipboard.writeText(v);}
  catch{
    const ta=document.createElement("textarea");
    ta.value=v;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");}catch{}
    ta.remove();
  }
}

function addRes(){
  const inp=$("#resInput"), st=$("#resStatus");
  const s=inp.value.trim().toLowerCase();
  if(!RES_RE.test(s)){setStatus(st,"格式不对：必须带刷新率，例如 2560x1440@60。","bad");return;}
  if(state.vda.list.some(x=>x.toLowerCase()===s)){setStatus(st,"该分辨率已在列表中。","warn");return;}
  state.vda.sel=state.vda.list.push(s)-1;
  inp.value="";inp.focus();
  resRows();
  setStatus(st,"已添加，记得保存。","");
}

function delRes(){
  const st=$("#resStatus");
  if(state.vda.sel<0){setStatus(st,"先在列表中选中要删除的分辨率。","warn");return;}
  state.vda.list.splice(state.vda.sel,1);
  state.vda.sel=Math.min(state.vda.sel,state.vda.list.length-1);
  resRows();
  setStatus(st,"已删除，记得保存。","");

function activeRes(){
  const st=$("#resStatus");
  if(state.vda.sel<0){setStatus(st,"先在列表中选中一个分辨率。","warn");return;}
  const m=SIZE_RE.exec(state.vda.list[state.vda.sel]||"");
  if(!m){setStatus(st,"无法解析该分辨率。","bad");return;}
  state.vda.aw=+m[1];state.vda.ah=+m[2];
  $("#resActive").textContent=`当前活动：${state.vda.aw} × ${state.vda.ah}`;
  resRows();
  setStatus(st,"已设为活动分辨率，保存后生效。","");

async function saveRes(){

  setStatus(st,"正在保存…","");
  if(HOSTED){
    try{const msg=await call("setResolution",{width:aw,height:ah,list});setStatus(st,msg,"ok");}
    catch(e){setStatus(st,"保存失败："+e.message,"bad");}
    return;
  }
  await wait(900);
  setStatus(st,`已保存，下一场串流按 ${aw} × ${ah} 建立。`,"ok");
}

async function savePorts(){
  const st=$("#portStatus");
  const cp=Number($("#p-c").value.trim()), gp=Number($("#p-g").value.trim());
  const ok=v=>Number.isInteger(v)&&v>=1024&&v<=65535;
  if(!ok(cp)){setStatus(st,"当前会话端口必须是 1024-65535 的数字。","bad");return;}
  if(!ok(gp)){setStatus(st,"游戏会话端口必须是 1024-65535 的数字。","bad");return;}
  if(Math.abs(cp-gp)<50){setStatus(st,"两个端口差需 ≥ 50，避免端口族重叠。","bad");return;}
  if(HOSTED){
    setStatus(st,"端口已写入，正在重启会话…","");
    try{
      const msg=await call("savePorts",{cport:cp,gport:gp});
      state.core.cport=cp;state.core.gport=gp;
      state.sessions.console.stream=cp;state.sessions.game.stream=gp;
      syncSessions();
      setStatus(st,msg,"ok");
    }catch(e){setStatus(st,"保存失败："+e.message,"bad");}
    return;
  }
  const changed=[];
  if(cp!==state.core.cport)changed.push("当前会话");
  if(gp!==state.core.gport)changed.push("游戏会话");
  state.core.cport=cp;state.core.gport=gp;
  state.sessions.console.stream=cp;state.sessions.game.stream=gp;
  syncSessions();
  if(!changed.length){setStatus(st,"端口未变化。","");return;}
  setStatus(st,"端口已写入，正在重启 "+changed.join("、")+"…","");
  await wait(1100);
  setStatus(st,"端口已保存，会话已重启。","ok");
}

  if(HOSTED){

      const r=await call("toggleService");
      state.core.service=r.service;
      renderService();
      setStatus($("#svcStatus"),r.message,"ok");
    }catch(e){setStatus($("#svcStatus"),e.message,"bad");}
    btn.disabled=false;
    return;
  }
  await wait(900);
  state.core.service=running?"已停止":"运行中";
  renderService();
  btn.disabled=false;
  setStatus($("#svcStatus"),(running?"停止":"启动")+"指令已执行。","ok");
}

async function restartSession(el){

/* ToggleSwitch 交互移植自 WinUIonWeb ToggleSwitch.vue：
   拖拽过半程翻转、未移动直接翻转、pressed/dragging 视觉态、Space/Enter 触发 */
const SW_MAX_TX=20, SW_MIN_TX=0, SW_THRESHOLD=3;
const swSwitch=el=>el.querySelector(".win-switch");
function swSetVisual(el,tx,on,cls){
  const sw=swSwitch(el);
  sw.style.setProperty("--tx",tx+"px");
  sw.classList.toggle("is-on",on);
  if(cls)sw.classList.add(cls);else sw.classList.remove("is-pressed","dragging");
}

function swCommit(el,next){
  const on=el.getAttribute("aria-checked")==="true";
  if(next!==on){
    el.setAttribute("aria-checked",String(next));
    swSetVisual(el,next?SW_MAX_TX:SW_MIN_TX,next);
    actSwChanged(el,next);
  }
}
async function actSwChanged(el,next){
  const key=el.dataset.key;
  if(key==="etEnabled"||key==="etTcp"){
    const m=document.querySelector('.sw[data-key="etEnabled"]');
    await etApply(m&&m.getAttribute("aria-checked")==="true");return;
  }
  state.core[key]=next;
  if(HOSTED){
    try{
      if(key==="autoStart")await call("setAutoStart",{enabled:next});
      else if(key==="hideCursor")await call("setHideCursor",{enabled:next});
      else await call("setHotkeys",{ralt:state.core.ralt,raltl:state.core.raltl});
    }catch(e){
      state.core[key]=!next;
      el.setAttribute("aria-checked",String(!next));
      swSetVisual(el,!next?SW_MAX_TX:SW_MIN_TX,!next,"is-on");
      toast(e.message,false);
      return;
    }
  }
  if(key==="autoStart"){toast(next?"已加入登录启动项。":"已移除登录启动项。");return;}
  if(key==="hideCursor"){
    setStatus($("#hkStatus"),next?"连接后将隐藏系统鼠标指针。":"已恢复显示系统鼠标指针。","ok");
    return;
  }
  setStatus($("#hkStatus"),"快捷键设置已应用。","ok");
}

/* pointer 拖拽（移植 WinUIonWeb ToggleSwitch.vue onDown/onMove/onUp/onCancel） */
const swPtr={id:null,el:null,startX:0,initial:false,tx:0,moved:false,handled:false};
function swPointerClicked(el){
  /* pointerup 已在 swPtrEnd 里翻转；这里只兜底"没有 pointer 手势"的 click（如键盘/程序触发） */
  if(swPtr.handled){swPtr.handled=false;return;}
  swCommit(el,el.getAttribute("aria-checked")!=="true");
}
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest('.sw[role="switch"]');
  if(!el||e.button!==0)return;
  const sw=swSwitch(el);
  swPtr.id=e.pointerId;swPtr.el=el;swPtr.moved=false;swPtr.handled=false;
  swPtr.initial=el.getAttribute("aria-checked")==="true";
  swPtr.tx=swPtr.initial?SW_MAX_TX:SW_MIN_TX;swPtr.startX=e.clientX;
  sw.classList.add("is-pressed");
  el.focus({preventScroll:true});
  try{sw.setPointerCapture(e.pointerId);}catch{}
});
document.addEventListener("pointermove",e=>{
  if(swPtr.id===null||e.pointerId!==swPtr.id)return;
  const delta=e.clientX-swPtr.startX;
  if(Math.abs(delta)>SW_THRESHOLD)swPtr.moved=true;
  const next=swPtr.initial?SW_MAX_TX+delta:SW_MIN_TX+delta;
  swPtr.tx=Math.max(SW_MIN_TX,Math.min(SW_MAX_TX,next));
  const sw=swSwitch(swPtr.el);
  if(swPtr.moved){
    sw.classList.add("dragging");
    sw.style.setProperty("--tx",swPtr.tx+"px");
  }
});
function swPtrEnd(e,cancel){
  if(swPtr.id===null||(e&&e.pointerId!==swPtr.id))return;
  const el=swPtr.el, sw=swSwitch(el);
  const wasMoved=swPtr.moved, wasChecked=swPtr.initial, tx=swPtr.tx;
  sw.classList.remove("is-pressed","dragging");
  swPtr.id=null;swPtr.el=null;
  try{if(sw.hasPointerCapture(e.pointerId))sw.releasePointerCapture(e.pointerId);}catch{}
  if(cancel){sw.style.setProperty("--tx",(wasChecked?SW_MAX_TX:SW_MIN_TX)+"px");return;}
  swPtr.handled=true;
  if(wasMoved){
    const half=(SW_MAX_TX-SW_MIN_TX)/2;
    const shouldToggle=wasChecked?tx<=half:tx>=half;
    swCommit(el,shouldToggle?!wasChecked:wasChecked);
  }else{
    swCommit(el,!wasChecked);
  }
}
document.addEventListener("pointerup",e=>swPtrEnd(e,false));
document.addEventListener("pointercancel",e=>swPtrEnd(e,true));

/* NavigationView 方向键漫游焦点（移植自 NavigationView.vue roving handler） */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const nav=document.activeElement&&document.activeElement.closest(".nav");
  if(!nav)return;
  const items=[...nav.querySelectorAll(".nav-item:not([style*='display: none'])")];
  const i=items.indexOf(document.activeElement);
  if(i<0)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="Home"||e.key==="End"){
    e.preventDefault();
    const next=e.key==="Home"?0:e.key==="End"?items.length-1:i+(e.key==="ArrowDown"?1:-1);
    items[Math.max(0,Math.min(items.length-1,next))].focus({preventScroll:true});
  }else if(e.key===" "||e.key==="Enter"){
    e.preventDefault();
    document.activeElement.click();
  }
});

/* ===================== 事件绑定 ===================== */

/* 滚动条不滚动时隐藏：滚动期间给容器加 .scrolling，停止 800ms 后移除 */
const scrollTimers=new WeakMap();
document.addEventListener("scroll",e=>{
  const el=e.target;
  if(!(el instanceof Element))return;
  el.classList.add("scrolling");
  clearTimeout(scrollTimers.get(el));
  scrollTimers.set(el,setTimeout(()=>el.classList.remove("scrolling"),800));
},true);

document.addEventListener("input",e=>{
  const el=e.target;
  if(!el.classList||!el.classList.contains("pinbox"))return;
  el.value=el.value.replace(/\D/g,"").slice(0,1);
  el.classList.toggle("has",el.value.length===1);
  if(!el.value)return;
  const boxes=pinBoxes(el.dataset.sid), i=boxes.indexOf(el);
  if(i<3)boxes[i+1].focus();
});

document.addEventListener("paste",e=>{
  const el=e.target;
  if(!el.classList||!el.classList.contains("pinbox"))return;
  e.preventDefault();
  const code=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,4);
  if(!code)return;
  const boxes=pinBoxes(el.dataset.sid);
  code.split("").forEach((c,i)=>{if(boxes[i]){boxes[i].value=c;boxes[i].classList.add("has");}});
  boxes[Math.min(code.length,3)].focus();
});

document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&!/^[1-6]$/.test(e.key))return;
  if((e.ctrlKey||e.metaKey)&&/^[1-6]$/.test(e.key)){navigate(NAV[+e.key-1].id);e.preventDefault();return;}
  const el=document.activeElement;
  if(!el||!el.classList.contains("pinbox"))return;
  const boxes=pinBoxes(el.dataset.sid), i=boxes.indexOf(el);
  if(e.key==="Backspace"&&!el.value&&i>0){
    boxes[i-1].focus();boxes[i-1].value="";boxes[i-1].classList.remove("has");e.preventDefault();
  }else if(e.key==="Enter"){submitPin(el.dataset.sid);e.preventDefault();}
  else if(e.key==="ArrowLeft"&&i>0)boxes[i-1].focus();
  else if(e.key==="ArrowRight"&&i<3)boxes[i+1].focus();
});

document.addEventListener("dblclick",e=>{
  const row=e.target.closest('[data-a="res-pick"]');
  if(!row)return;
  state.vda.sel=+row.dataset.i;
  resRows();
  activeRes();
});

/* ===================== 检测更新 ===================== */
/* HOSTED 时由宿主代查（托盘进程里比较本地 .VERSION）；预览态直连 GitHub raw，
   国内时区先走 .GITPROXY 下发的镜像前缀，失败退直连 */
const VERSION_URL="https://raw.githubusercontent.com/xRetia/Sunshine-Duo/main/.VERSION";
const GITPROXY_URL="https://raw.githubusercontent.com/xRetia/Sunshine-Duo/main/.GITPROXY";
const VER_RE=/^v?(\d+(?:\.\d+){0,3})/i;
const verCmp=(a,b)=>{
  const pa=a.split(".").map(Number),pb=b.split(".").map(Number),n=Math.max(pa.length,pb.length);
  for(let i=0;i<n;i++){const d=((pa[i]||0)-(pb[i]||0));if(d)return d>0?1:-1;}
  return 0;
};
async function getGitProxy(){
  try{
    if(new Date().getTimezoneOffset()!==-480)return null;
    const r=await fetch(GITPROXY_URL,{cache:"no-store"});
    const t=(await r.text()).trim();
    if(t.startsWith("https://")&&t.length<100&&!t.includes(" "))return t.replace(/\/+$/,"");
  }catch{}
  return null;
}
async function checkUpdate(force){
  if(state.update.check==="busy")return;
  if(HOSTED){
    if(force){state.update={...state.update,check:"busy"};render();}
    try{
      const u=await call("checkUpdate",{force:!!force});
      const has=!!(u&&u.has);
      state.update={...state.update,has,remote:(u&&u.remote)||"",local:(u&&u.local)||state.update.local||"",check:""};
      render();
      if(state.page==="about")navigate("about");
      if(has)toast(`发现新版本 v${(u&&u.remote)||""}`);
      else if(force)toast("已是最新版本");
    }catch{
      state.update={...state.update,check:""};
      render();
      if(state.page==="about")navigate("about");
      if(force)toast("检查失败，请稍后再试",false);
    }
    return;
  }
  if(force){state.update={...state.update,check:"busy"};render();}
  try{
    const proxy=await getGitProxy();
    const urls=proxy?[proxy+"/"+VERSION_URL,VERSION_URL]:[VERSION_URL];
    let done=false;
    for(const x of urls){
      try{
        const r=await fetch(x,{cache:"no-store"});
        const t=(await r.text()).trim();
        const m=VER_RE.exec(t);
        const remote=m?m[1]:"";
        const local=state.update.local||"1.0.0";
        const has=!!remote&&verCmp(remote,local)>0;
        state.update={...state.update,has,remote:remote||state.update.remote,local,check:has?"":force?"latest":""};
        done=true;break;
      }catch{}
    }
    if(!done){
      state.update={...state.update,check:""};
      render();
      if(state.page==="about")navigate("about");
      toast("检查失败，请稍后再试",false);
      return;
    }
    render();
    if(state.page==="about")navigate("about");
    if(state.update.has)toast(`发现新版本 v${state.update.remote}`);
    else toast("已是最新版本");
  }catch{
    state.update={...state.update,check:""};
    render();
    if(state.page==="about")navigate("about");
    toast("检查失败，请稍后再试",false);
  }
}
