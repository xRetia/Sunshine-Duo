<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunshine Duo</title>
<style>
/* ===================== Fluent 2 / WinUI 3 设计令牌 ===================== */
:root{
  --font-ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  --font-mono:"Cascadia Mono","Consolas",monospace;
  --r-win:10px; --r-card:8px; --r-ctl:4px;
  --ease:cubic-bezier(0,0,0,1); --dur:.167s;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#F3F3F3; --pane:#F7F7F7; --card:#FFFFFF; --card2:#F9F9F9;
  --stroke:rgba(0,0,0,.06); --stroke-2:rgba(0,0,0,.12);
  --text:rgba(0,0,0,.89); --muted:rgba(0,0,0,.62); --faint:rgba(0,0,0,.45);
  --fill:rgba(255,255,255,.70); --fill-hover:rgba(249,249,249,.50);
  --ctrl:#FFFFFF; --subtle:rgba(0,0,0,.0373); --subtle-2:rgba(0,0,0,.0241); --press:rgba(0,0,0,.06);
  --accent:#15803D; --accent-hover:#16A34A; --accent-press:#12632F;
  --accent-soft:rgba(21,128,61,.09); --on-accent:#FFFFFF; --accent-text:#15803D;
  --danger:#C42B1C; --warn:#9D5D00;
  --shadow:0 8px 26px rgba(0,0,0,.11),0 2px 6px rgba(0,0,0,.05);
  --hair:rgba(0,0,0,.06);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#202020; --pane:#252525; --card:#2B2B2B; --card2:#303030;
  --stroke:rgba(255,255,255,.08); --stroke-2:rgba(255,255,255,.16);
  --text:rgba(255,255,255,.89); --muted:rgba(255,255,255,.61); --faint:rgba(255,255,255,.42);
  --fill:rgba(255,255,255,.06); --fill-hover:rgba(255,255,255,.09);
  --ctrl:#242424; --subtle:rgba(255,255,255,.06); --subtle-2:rgba(255,255,255,.04); --press:rgba(255,255,255,.10);
  --accent:#1D9A50; --accent-hover:#22B45C; --accent-press:#17803F;
  --accent-soft:rgba(34,197,94,.12); --on-accent:#FFFFFF; --accent-text:#4ADE80;
  --danger:#F1707B; --warn:#E8A317;
  --shadow:0 14px 38px rgba(0,0,0,.52),0 2px 8px rgba(0,0,0,.36);
  --hair:rgba(255,255,255,.07);
}

/* ===================== 去浏览器化基础 ===================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui);font-size:14px;line-height:1.45;color:var(--text);
  background:#0a0c0f;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;cursor:default;overflow:hidden;
}
button,input{font:inherit;color:inherit;outline:none;background:none;border:0}
input{cursor:text;user-select:text;-webkit-user-select:text}
img,svg{-webkit-user-drag:none;user-select:none}
::selection{background:var(--accent-soft)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.drag{-webkit-app-region:drag;app-region:drag}
.nodrag{-webkit-app-region:no-drag;app-region:no-drag}
html.notrans *{transition:none !important}

/* ===================== 预览舞台 ===================== */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:
    radial-gradient(900px 620px at 20% 6%,rgba(34,197,94,.10),transparent 62%),
    radial-gradient(1100px 760px at 82% 96%,rgba(70,130,240,.09),transparent 60%),
    linear-gradient(158deg,#131720,#0a0c10 55%,#07080a);
}
.stage-note{font-size:11.5px;color:#69727f;text-align:center;letter-spacing:.01em}
.stage-note b{color:#9aa4b2;font-weight:600}
.reopen{display:none;height:32px;padding:0 16px;border-radius:var(--r-ctl);background:var(--card);
  border:1px solid var(--stroke);color:var(--text);font-size:13px;cursor:default}
.reopen:hover{background:var(--fill-hover)}
.stage.closed .app{display:none}
.stage.closed .reopen{display:inline-flex;align-items:center}

/* ===================== 窗口外壳 ===================== */
.app{position:relative;width:1020px;height:680px;flex:none;display:grid;grid-template-columns:236px 1fr;
  background:var(--bg);border-radius:var(--r-win);box-shadow:inset 0 0 0 1px var(--stroke),var(--shadow);
  overflow:hidden;transform:scale(var(--fit,1));transform-origin:center;
  transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.app.min{transform:scale(calc(var(--fit,1) * .94));opacity:0}

/* ===================== NavigationView 风格侧栏 ===================== */
.sidebar{background:var(--pane);border-right:1px solid var(--stroke);
  padding:20px 12px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:12px;padding-left:12px}
.logo{width:40px;height:40px;border-radius:8px;flex:none;display:grid;place-items:center;color:var(--on-accent);
  background:linear-gradient(155deg,var(--accent-hover),var(--accent));
  box-shadow:0 2px 8px var(--accent-soft)}
.logo svg{width:22px;height:22px;stroke-width:1.6}
.brand-name{font-family:var(--font-display);font-size:15px;font-weight:600;line-height:1.2}
.brand-sub{font-size:12px;color:var(--muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;
  border-radius:var(--r-ctl);font-size:14px;color:var(--text);text-align:left;
  transition:background var(--dur) var(--ease)}
.nav-item svg{width:16px;height:16px;color:var(--muted);transition:color var(--dur) var(--ease)}
.nav-item:hover{background:var(--subtle-2)}
.nav-item:active{background:var(--subtle)}
.nav-item.on{background:var(--subtle)}
.nav-item.on svg{color:var(--accent-text)}
.nav-item.on::after{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:16px;border-radius:2px;background:var(--accent)}
.side-foot{margin-top:auto;padding:0 12px}
.hair{height:1px;background:var(--hair);margin-bottom:12px}
.svc{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-height:20px}
.svc .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--dotc,var(--muted)) 16%,transparent)}
.svc.ok .dot{background:var(--accent-text);--dotc:var(--accent-text)}
.svc.warn .dot{background:var(--warn);--dotc:var(--warn)}
.svc.bad .dot{background:var(--danger);--dotc:var(--danger)}
.svc svg{width:14px;height:14px;color:var(--faint);margin-left:auto}

/* ===================== 内容区 ===================== */
.content{position:relative;overflow-y:auto;overflow-x:hidden;padding:0 24px;scrollbar-width:thin}
.content::-webkit-scrollbar{width:12px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--stroke-2);border:5px solid transparent;
  background-clip:content-box;border-radius:99px}
.content::-webkit-scrollbar-thumb:hover{background:var(--muted);border:4px solid transparent;background-clip:content-box}
.page{display:none;padding:20px 0 24px}
.page.on{display:block;animation:pageIn .18s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;padding-right:92px}
.h1{font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.sub{font-size:14px;color:var(--muted);margin-top:5px}
.h2{font-size:16px;font-weight:600;line-height:1.3}
.sec{margin-top:20px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.sec-h .right{margin-left:auto;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--faint);line-height:1.6;margin-top:14px}
.divider{height:1px;background:var(--hair);margin:20px 0}

/* 窗口控件：WinUI caption button */
.winctl{position:absolute;top:0;right:0;z-index:8;display:flex}
.wbtn{width:46px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:0;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.wbtn svg{width:14px;height:14px}
.wbtn:hover{background:var(--fill-hover);color:var(--text)}
.wbtn.x:hover{background:#C42B1C;color:#fff}

/* InfoBadge 状态胶囊 */
.pill{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:12px;
  font-size:12px;font-weight:600;flex:none;--pc:var(--muted);
  background:color-mix(in srgb,var(--pc) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--pc) 34%,transparent)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--pc);flex:none}
.pill.ok{--pc:var(--accent-text)} .pill.bad{--pc:var(--danger)} .pill.wait{--pc:var(--warn)}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r-card);padding:16px;
  transition:background var(--dur) var(--ease)}
.card-t{font-size:14px;font-weight:600;white-space:nowrap}
.card-d{font-size:12px;color:var(--muted);line-height:1.55;margin-top:4px}
.card-top{display:flex;align-items:center;gap:6px;min-height:22px}
.card-top .btn{margin-left:auto}
.card-top .btn.sm{padding:0 8px;font-size:12px}
.val{font-family:var(--font-mono);font-size:18px;font-weight:600;letter-spacing:.005em;
  margin-top:11px;user-select:text;-webkit-user-select:text;white-space:nowrap}
.card-top+.val{margin-top:9px}
.status{font-size:12px;color:var(--muted);min-height:17px;margin-top:10px;line-height:1.5}
.status.ok{color:var(--accent-text)} .status.bad{color:var(--danger)} .status.warn{color:var(--warn)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols>div{display:flex;flex-direction:column;gap:16px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;
  border-radius:var(--r-ctl);background:var(--fill);border:1px solid var(--stroke);color:var(--text);
  font-size:14px;white-space:nowrap;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform 80ms var(--ease)}
.btn:hover{background:var(--fill-hover);border-color:var(--stroke-2)}
.btn:active{background:var(--press);transform:scale(.99)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:14px;height:14px;color:var(--muted)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600}
.btn.pri:hover{background:var(--accent-hover);border-color:transparent}
.btn.pri:active{background:var(--accent-press)}
.btn.pri svg{color:var(--on-accent)}
.btn.sm{height:26px;padding:0 8px;font-size:12px;border-radius:var(--r-ctl)}
.btn.lg{height:36px;padding:0 20px;font-size:14px}
.btn.blk{width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn[data-a="wan"]:hover svg{transform:rotate(120deg)}
.btn svg{transition:transform var(--dur) var(--ease)}

/* TextBox */
.field{display:block}
.field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.input{width:100%;height:32px;padding:0 10px;border-radius:var(--r-ctl);background:var(--ctrl);
  border:1px solid var(--stroke);border-bottom-color:var(--stroke-2);font-size:14px;
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.input:hover{border-color:var(--stroke-2)}
.input:focus{border-color:var(--stroke);box-shadow:inset 0 -2px 0 var(--accent)}
.input.mono{font-family:var(--font-mono);letter-spacing:.02em}
.input::placeholder{color:var(--faint)}

/* ToggleSwitch */
.sw{display:flex;align-items:center;gap:14px;width:100%;min-height:36px;text-align:left}
.sw-t{font-size:14px}
.sw-d{font-size:12px;color:var(--muted);margin-top:2px;display:block}
.sw .track{margin-left:auto;flex:none;position:relative;width:40px;height:20px;border-radius:10px;
  background:var(--fill);border:1px solid var(--stroke-2);
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.sw .track::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;
  background:var(--muted);transition:transform var(--dur) var(--ease),width var(--dur) var(--ease),
  height var(--dur) var(--ease),top var(--dur) var(--ease),background var(--dur) var(--ease)}
.sw[aria-checked="true"] .track{background:var(--accent);border-color:transparent}
.sw[aria-checked="true"] .track::after{transform:translateX(20px);background:var(--on-accent)}
.sw:hover .track::after{width:14px;height:14px;top:2px}
.sw[aria-checked="true"]:hover .track::after{transform:translateX(19px)}

/* SelectorBar / 主题切换 */
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:6px;background:var(--fill);border:1px solid var(--stroke)}
.seg button{height:26px;padding:0 12px;border-radius:var(--r-ctl);font-size:12px;color:var(--muted);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.seg button:hover{color:var(--text);background:var(--fill-hover)}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg button.on:hover{background:var(--accent-hover)}

/* 模式选择卡片 */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{padding:18px 14px 16px;border-radius:var(--r-card);background:var(--card);border:1px solid var(--stroke);
  text-align:center;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.mode svg{width:32px;height:32px;margin:0 auto 12px;color:var(--muted);stroke-width:1.5;transition:color var(--dur) var(--ease)}
.mode b{display:block;font-size:14px;font-weight:600}
.mode span{display:block;font-size:12px;color:var(--muted);line-height:1.55;margin-top:6px}
.mode:hover{background:var(--card2)}
.mode:active{transform:scale(.995)}
.mode.on{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mode.on svg,.mode.on b{color:var(--accent-text)}

/* 地址条 */
.addr{display:flex;align-items:center;gap:16px;padding:14px 16px;margin-top:12px}
.addr .k{font-size:12px;color:var(--muted)}
.addr .v{font-family:var(--font-mono);font-size:18px;font-weight:600;margin-top:3px;
  user-select:text;-webkit-user-select:text}
.addr .btn{margin-left:auto}

/* PIN */
.pairrow{display:flex;align-items:center;gap:18px;margin-top:14px}
.pin{display:flex;gap:10px}
.pin input{width:56px;height:56px;text-align:center;border-radius:6px;background:var(--ctrl);
  border:1px solid var(--stroke);border-bottom-color:var(--stroke-2);font-family:var(--font-mono);
  font-size:24px;font-weight:600;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background var(--dur)}
.pin input:hover{border-color:var(--stroke-2)}
.pin input:focus{border-color:var(--stroke);box-shadow:inset 0 -2px 0 var(--accent)}
.pin input.has{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}

/* ListView 分辨率 */
.res{border:1px solid var(--stroke);border-radius:var(--r-card);overflow:hidden;background:var(--card);
  max-height:252px;overflow-y:auto;scrollbar-width:thin}
.res::-webkit-scrollbar{width:12px}
.res::-webkit-scrollbar-thumb{background:var(--stroke-2);border:5px solid transparent;background-clip:content-box;border-radius:99px}
.res-row{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;
  border-bottom:1px solid var(--hair);font-family:var(--font-mono);font-size:13px;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.res-row:last-child{border-bottom:0}
.res-row:hover{background:var(--subtle-2)}
.res-row.sel{background:var(--accent-soft);color:var(--accent-text)}
.res-row .idx{font-family:var(--font-ui);font-size:11px;color:var(--faint);width:14px}
.res-row.sel .idx{color:var(--accent-text)}
.res-row .tag{margin-left:auto;font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--accent-text)}
.empty{padding:26px 14px;text-align:center;font-size:12px;color:var(--faint)}
.res-side{display:flex;flex-direction:column;gap:10px}
.res-side .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 关于 */
.ident{display:flex;align-items:center;gap:16px;margin-top:20px}
.ident .logo{width:56px;height:56px;border-radius:12px}
.ident .logo svg{width:30px;height:30px}
.ident-name{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.2}
.ident-ver{font-size:12px;color:var(--muted);margin-top:5px}
.kv{display:flex;flex-direction:column;gap:4px}
.kv .k{font-size:12px;color:var(--faint)}
.kv .v2{font-size:14px}
.kv .v3{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:2px}
.arch{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.arch li{display:flex;gap:9px;font-size:13px;color:var(--muted);line-height:1.6;list-style:none}
.arch li:first-child{color:var(--text)}
.arch li::before{content:"·";color:var(--accent-text);font-weight:700;line-height:1.5}

/* InfoBar 提示 */
.toast{position:absolute;left:50%;bottom:20px;z-index:9;transform:translate(-50%,10px);
  display:flex;align-items:center;gap:9px;min-height:36px;padding:0 14px;border-radius:6px;
  background:var(--card);border:1px solid var(--stroke-2);box-shadow:0 10px 30px rgba(0,0,0,.28);
  font-size:13px;opacity:0;pointer-events:none;
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:15px;height:15px;color:var(--accent-text)}
.toast.err svg{color:var(--danger)}

/* 布局工具 */
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:start}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:14px}
.mt16{margin-top:16px}
.mt22{margin-top:22px}
.grow{flex:1}
.cap{font-size:12px;color:var(--muted)}
.between{display:flex;align-items:center;gap:16px}
.card .svc{font-size:13px;color:var(--text)}

/* ===================== 宿主模式 ===================== */
html.hosted,html.hosted body{width:100%;height:100%;background:var(--bg);overflow:hidden}
html.hosted .stage{position:static;display:block;background:transparent;gap:0}
html.hosted .app{width:100vw;height:100vh;border-radius:0;box-shadow:none;--fit:1;transform:none}
html.hosted .stage-note,html.hosted .reopen{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M18.7 5.3l-1.9 1.9M7.2 16.8l-1.9 1.9"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2.6" y="4" width="18.8" height="12.4" rx="2.2"/><path d="M12 16.4V20M8.4 20h7.2"/></symbol>

/* ===================== 宿主 RPC ===================== */
const HOSTED=!!(window.chrome&&window.chrome.webview);
if(HOSTED)document.documentElement.classList.add("hosted");
let rpcSeq=0;
const RPC=new Map();
function call(method,args={}){
  if(!HOSTED)return Promise.reject(new Error("预览模式无宿主"));
  return new Promise((ok,fail)=>{
    const id=++rpcSeq;
    RPC.set(id,{ok,fail});
    window.chrome.webview.postMessage({id,method,args});
  });
}
async function remote(method,args){
  try{return await call(method,args);}catch(e){toast(e.message,false);throw e;}
}
if(HOSTED){
  window.addEventListener("error",e=>call("log",{message:"UI error: "+e.message}));
  window.addEventListener("unhandledrejection",e=>call("log",{message:"UI reject: "+(e.reason&&e.reason.message||e.reason)}));
  window.__sdReply=m=>{
    const p=RPC.get(m.id);
    if(!p)return;
    RPC.delete(m.id);
    m.ok?p.ok(m.result):p.fail(new Error(m.error||"调用失败"));
  };
  window.__sdEvent=m=>onEvent(m.event,m.data);
  window.chrome.webview.addEventListener("message",e=>{
    const m=e.data;
    if(!m)return;
    if(m.id!==undefined&&m.method===undefined)window.__sdReply(m);
    else if(m.event)window.__sdEvent(m);
  });
}

/* ===================== 宿主事件 ===================== */
function applySnapshot(s){
  state={...state,...s,
    net:{...state.net,...(s.net||{})},
    sessions:{...state.sessions,...(s.sessions||{})},
    core:{...state.core,...(s.core||{})},
    vda:{...state.vda,...(s.vda||{})}};
  if(s.sessions)for(const x of Object.values(s.sessions))state.sessions[x.id]=x;
  render();
  applyTheme(state.theme);
  if(s.page)navigate(s.page);
  if(s.focusPin){const f=document.querySelector("#pin-console input");if(f)f.focus();}
  if(s.consoleEnabled===false||s.gameEnabled===false){
    $$('.nav-item').forEach(b=>{
      if((s.consoleEnabled===false&&["console","vda"].includes(b.dataset.nav))||
         (s.gameEnabled===false&&b.dataset.nav==="game")) b.style.display="none";
    });
    if(s.consoleEnabled===false){const el=$("#p-c");if(el)el.closest(".field").style.display="none";}
    if(s.gameEnabled===false){const el=$("#p-g");if(el)el.closest(".field").style.display="none";}
    $$('[data-a="restart"]').forEach(b=>{
      const id=b.dataset.id;
      if((id==="console"&&s.consoleEnabled===false)||(id==="game"&&s.gameEnabled===false))b.style.display="none";
    });
  }
}

function onEvent(name,data){
  if(name==="session"){
    for(const [id,up] of Object.entries(data||{})){
      const pill=$("#pill-"+id);
      if(!pill)continue;
      pill.className="pill nodrag "+(up===true?"ok":up===false?"bad":"wait");
      $("#pillText-"+id).textContent=up===true?"运行中":up===false?"未运行":"检测中";
    }
    return;
  }
  if(name==="service"){state.core.service=data;renderService();return;}
  if(name==="wan"){
    state.net.wan=data;
    $$('.val[id^="v-wan-"]').forEach(el=>{el.textContent=data});
    return;
  }
  if(name==="navigate"){navigate(data);return;}
  if(name==="focusPair"){
    navigate("console");
    const first=document.querySelector("#pin-console input");
    if(first)first.focus();
    return;
  }
  if(name==="theme"){applyTheme(data);return;}
}

async function pollRemote(){
  while(HOSTED){
    await wait(2500);
    try{
      const s=await call("poll");
      onEvent("session",s.sessions);
      onEvent("service",s.service);
      if(s.wan)onEvent("wan",s.wan);
    }catch{}
  }
}

/* ===================== 渲染 ===================== */
const RES_RE=/^\d{2,5}x\d{2,5}@\d{2,3}$/;
const SIZE_RE=/^(\d+)x(\d+)/;
const lightMQ=matchMedia("(prefers-color-scheme: light)");

function render(){
  $("#app").innerHTML=sidebarHTML()
    +`<main class="content">`
      +sessionHTML(state.sessions.console)
      +sessionHTML(state.sessions.game)
      +vdaHTML()
      +settingsHTML()
      +aboutHTML()
    +`</main>`
    +`<div class="winctl nodrag">
        <button class="wbtn" data-a="min" aria-label="最小化">${ic("min")}</button>
        <button class="wbtn x" data-a="close" aria-label="关闭">${ic("x")}</button>
      </div>
      <div class="toast" id="toast"><span id="toastIcon"></span><span id="toastText"></span></div>`;
  $("#stageNote").innerHTML=
    "<b>Sunshine Duo · WebView2 界面预览</b>　拖拽 / 窗口按钮 / 右键屏蔽 / 主题切换：宿主侧由 WebView2 + WinForms 承担";
  resRows();
  renderService();
  fit();
}

function navigate(id){
  state.page=id;
  $$(".nav-item").forEach(b=>b.classList.toggle("on",b.dataset.nav===id));
  $$(".page").forEach(p=>p.classList.toggle("on",p.dataset.page===id));
  $(".content").scrollTop=0;
}

const resolveTheme=m=>m==="light"?"light":m==="dark"?"dark":(lightMQ.matches?"light":"dark");
function applyTheme(mode){
  state.theme=mode;
  if(!HOSTED&&!THEME_PARAM)localStorage.setItem("sd.theme",mode);
  const root=document.documentElement;
  root.classList.add("notrans");
  root.dataset.theme=resolveTheme(mode);
  void root.offsetHeight;
  requestAnimationFrame(()=>root.classList.remove("notrans"));
  /* 页面隐藏时 rAF 不会触发（WebView2 最小化也是），补一个定时器兜底 */
  setTimeout(()=>root.classList.remove("notrans"),120);
  $$('[data-a="theme"]').forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
}

function toast(text,ok=true){
  $("#toastIcon").innerHTML=ic(ok?"check":"info");
  $("#toastText").textContent=text;
  const t=$("#toast");
  t.classList.toggle("err",!ok);
  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove("on"),1900);
}

function setStatus(el,text,kind){
  if(!el)return;
  el.className="status"+(kind?" "+kind:"");
  el.textContent=text;
}

const SVC_KIND={"运行中":"ok","启动中":"warn","停止中":"warn"};
function renderService(){
  const s=state.core.service, kind=SVC_KIND[s]||"bad";
  $("#svcSide").className="svc "+kind;
  $("#svcText").textContent="核心服务："+s;
  $("#svcCard").className="svc mt "+kind;
  $("#svcCardText").textContent="SunshineDuoCore："+s;
  const btn=$("#svcBtn");
  btn.textContent=(s==="运行中"||s==="启动中"?"停止":"启动")+"服务";
  btn.disabled=s==="未安装"||s==="查询失败";
}

function resRows(){
  const {list,sel,aw,ah}=state.vda, box=$("#resList");
  if(!list.length){box.innerHTML='<div class="empty">列表为空，先在右侧添加一条分辨率。</div>';return;}
  const firstMatch=list.findIndex(r=>{
    const m=SIZE_RE.exec(r);
    return m&&+m[1]===aw&&+m[2]===ah;
  });
  box.innerHTML=list.map((r,i)=>{
    return `<div class="res-row${i===sel?" sel":""}" data-a="res-pick" data-i="${i}">`
      +`<span class="idx">${i+1}</span><span>${esc(r)}</span>${i===firstMatch?'<span class="tag">当前活动</span>':""}</div>`;
  }).join("");
}

function syncSessions(){
  for(const s of Object.values(state.sessions)){
    $("#v-port-"+s.id).textContent=String(s.stream);
    $("#v-addr-"+s.id).textContent=state.net.lan+":"+s.stream;
  }
}

function fit(){
  const s=Math.max(.5,Math.min(1,(innerWidth-40)/1020,(innerHeight-96)/680));
  document.documentElement.style.setProperty("--fit",String(s));
}

/* ===================== 行为 ===================== */
async function copyText(v){
  if(HOSTED){await call("copyText",{text:v});return;}
  try{await navigator.clipboard.writeText(v);}
  catch{
    const ta=document.createElement("textarea");
    ta.value=v;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");}catch{}
    ta.remove();
  }
}

function pinBoxes(sid){return $$(`#pin-${sid} input`)}

async function submitPin(sid){
  const st=$("#pairStatus-"+sid), btn=$(`[data-a="pair"][data-sid="${sid}"]`);
  const code=pinBoxes(sid).map(b=>b.value).join("");
  if(code.length!==4){setStatus(st,"请输入设备上显示的 4 位配对码。","bad");return;}
  btn.disabled=true;btn.textContent="提交中…";
  setStatus(st,"正在提交…","");
  if(HOSTED){
    try{
      const msg=await call("sendPin",{sid,code});
      setStatus(st,msg,"ok");
      pinBoxes(sid).forEach(b=>{b.value="";b.classList.remove("has")});
      pinBoxes(sid)[0].focus();
    }catch(e){setStatus(st,"配对失败："+e.message,"bad");}
    btn.disabled=false;btn.textContent="配对";
    return;
  }
  await wait(1000);
  btn.disabled=false;btn.textContent="配对";
  setStatus(st,"配对成功，已授予全部权限。请在 Moonlight 上确认。","ok");
  pinBoxes(sid).forEach(b=>{b.value="";b.classList.remove("has")});
  pinBoxes(sid)[0].focus();
}

async function applyMode(id){
  if(state.vda.busy)return;
  state.vda.busy=true;
  state.vda.mode=id;
  $$(".mode").forEach(m=>m.classList.toggle("on",m.dataset.mode===id));
  setStatus($("#modeStatus"),"正在切换显示拓扑…","");
  if(HOSTED){
    try{await call("setDisplayMode",{mode:id});setStatus($("#modeStatus"),`已切换为「${MODES.find(m=>m.id===id).t}」。串流中的拓扑已立即调整。`,"ok");}
    catch(e){setStatus($("#modeStatus"),"切换失败："+e.message,"bad");}
    state.vda.busy=false;
    return;
  }
  await wait(800);
  const name=MODES.find(m=>m.id===id).t;
  setStatus($("#modeStatus"),`已切换为「${name}」。串流中的拓扑已立即调整。`,"ok");
  state.vda.busy=false;
}

function addRes(){
  const inp=$("#resInput"), st=$("#resStatus");
  const s=inp.value.trim().toLowerCase();
  if(!RES_RE.test(s)){setStatus(st,"格式不对：必须带刷新率，例如 2560x1440@60。","bad");return;}
  if(state.vda.list.some(x=>x.toLowerCase()===s)){setStatus(st,"该分辨率已在列表中。","warn");return;}
  state.vda.sel=state.vda.list.push(s)-1;
  inp.value="";inp.focus();
  resRows();
  setStatus(st,"已添加，记得保存。","");
}

function delRes(){
  const st=$("#resStatus");
  if(state.vda.sel<0){setStatus(st,"先在列表中选中要删除的分辨率。","warn");return;}
  state.vda.list.splice(state.vda.sel,1);
  state.vda.sel=Math.min(state.vda.sel,state.vda.list.length-1);
  resRows();
  setStatus(st,"已删除，记得保存。","");
}

function activeRes(){
  const st=$("#resStatus");
  if(state.vda.sel<0){setStatus(st,"先在列表中选中一个分辨率。","warn");return;}
  const m=SIZE_RE.exec(state.vda.list[state.vda.sel]||"");
  if(!m){setStatus(st,"无法解析该分辨率。","bad");return;}
  state.vda.aw=+m[1];state.vda.ah=+m[2];
  $("#resActive").textContent=`当前活动：${state.vda.aw} × ${state.vda.ah}`;
  resRows();
  setStatus(st,"已设为活动分辨率，保存后生效。","");
}

async function saveRes(){
  const st=$("#resStatus"), {list,aw,ah}=state.vda;
  const bad=list.find(r=>!RES_RE.test(r));
  if(bad){setStatus(st,"存在无效条目："+bad,"bad");return;}
  setStatus(st,"正在保存…","");
  if(HOSTED){
    try{const msg=await call("setResolution",{width:aw,height:ah,list});setStatus(st,msg,"ok");}
    catch(e){setStatus(st,"保存失败："+e.message,"bad");}
    return;
  }
  await wait(900);
  setStatus(st,`已保存，下一场串流按 ${aw} × ${ah} 建立。`,"ok");
}

async function savePorts(){
  const st=$("#portStatus");
  const cp=Number($("#p-c").value.trim()), gp=Number($("#p-g").value.trim());
  const ok=v=>Number.isInteger(v)&&v>=1024&&v<=65535;
  if(!ok(cp)){setStatus(st,"当前会话端口必须是 1024-65535 的数字。","bad");return;}
  if(!ok(gp)){setStatus(st,"游戏会话端口必须是 1024-65535 的数字。","bad");return;}
  if(Math.abs(cp-gp)<50){setStatus(st,"两个端口差需 ≥ 50，避免端口族重叠。","bad");return;}
  if(HOSTED){
    setStatus(st,"端口已写入，正在重启会话…","");
    try{
      const msg=await call("savePorts",{cport:cp,gport:gp});
      state.core.cport=cp;state.core.gport=gp;
      state.sessions.console.stream=cp;state.sessions.game.stream=gp;
      syncSessions();
      setStatus(st,msg,"ok");
    }catch(e){setStatus(st,"保存失败："+e.message,"bad");}
    return;
  }
  const changed=[];
  if(cp!==state.core.cport)changed.push("当前会话");
  if(gp!==state.core.gport)changed.push("游戏会话");
  state.core.cport=cp;state.core.gport=gp;
  state.sessions.console.stream=cp;state.sessions.game.stream=gp;
  syncSessions();
  if(!changed.length){setStatus(st,"端口未变化。","");return;}
  setStatus(st,"端口已写入，正在重启 "+changed.join("、")+"…","");
  await wait(1100);
  setStatus(st,"端口已保存，会话已重启。","ok");
}

async function applyCred(){
  const st=$("#credStatus");
  const u=$("#c-user").value.trim(), p=$("#c-pass").value, q=$("#c-confirm").value;
  if(!u||p.length<4){setStatus(st,"用户名不能为空，密码至少 4 位。","bad");return;}
  if(p!==q){setStatus(st,"两次输入的密码不一致。","bad");return;}
  setStatus(st,"正在写入凭证…","");
  if(HOSTED){
    try{const msg=await call("applyCredentials",{user:u,pass:p});state.core.user=u;setStatus(st,msg,"ok");}
    catch(e){setStatus(st,"写入失败："+e.message,"bad");}
    $("#c-pass").value="";$("#c-confirm").value="";
    return;
  }
  await wait(1000);
  state.core.user=u;
  $("#c-pass").value="";$("#c-confirm").value="";
  setStatus(st,"凭证已应用，Apollo 正在重启。","ok");
}

async function toggleService(){
  const btn=$("#svcBtn");
  const running=state.core.service==="运行中"||state.core.service==="启动中";
  btn.disabled=true;
  setStatus($("#svcStatus"),"正在请求提权（gsudo64）…","");
  if(HOSTED){
    try{
      const r=await call("toggleService");
      state.core.service=r.service;
      renderService();
      setStatus($("#svcStatus"),r.message,"ok");
    }catch(e){setStatus($("#svcStatus"),e.message,"bad");}
    btn.disabled=false;
    return;
  }
  await wait(900);
  state.core.service=running?"已停止":"运行中";
  renderService();
  btn.disabled=false;
  setStatus($("#svcStatus"),(running?"停止":"启动")+"指令已执行。","ok");
}

async function restartSession(el){
  const name=el.dataset.name;
  el.disabled=true;
  setStatus($("#svcStatus"),"正在重启"+name+"…","");
  if(HOSTED){
    try{const msg=await call("restartApollo",{id:el.dataset.id});setStatus($("#svcStatus"),msg,"ok");}
    catch(e){setStatus($("#svcStatus"),"重启失败："+e.message,"bad");}
    el.disabled=false;
    return;
  }
  await wait(1000);
  setStatus($("#svcStatus"),name+"重启指令已执行。","ok");
  el.disabled=false;
}

async function toggleSwitch(el){
  const key=el.dataset.key, on=el.getAttribute("aria-checked")==="true";
  el.setAttribute("aria-checked",String(!on));
  state.core[key]=!on;
  if(HOSTED){
    try{
      if(key==="autoStart")await call("setAutoStart",{enabled:!on});
      else if(key==="hideCursor")await call("setHideCursor",{enabled:!on});
      else await call("setHotkeys",{ralt:state.core.ralt,raltl:state.core.raltl});
    }catch(e){
      el.setAttribute("aria-checked",String(on));
      state.core[key]=on;
      toast(e.message,false);
      return;
    }
  }
  if(key==="autoStart"){toast(!on?"已加入登录启动项。":"已移除登录启动项。");return;}
  if(key==="hideCursor"){
    setStatus($("#hkStatus"),!on?"连接后将隐藏系统鼠标指针。":"已恢复显示系统鼠标指针。","ok");
    return;
  }
  setStatus($("#hkStatus"),"快捷键设置已应用。","ok");
}

async function minimize(){
  if(HOSTED){call("windowMinimize");return;}
  const a=$("#app");
  a.classList.add("min");
  await wait(720);
  a.classList.remove("min");
}

const ACT={
  nav:el=>navigate(el.dataset.nav),
  copy:el=>{
    const v=$("#"+el.dataset.src).textContent.trim();
    if(!v||v==="获取中…"||v==="获取失败")return;
    copyText(v);
    toast("已复制："+v);
  },
  wan:async el=>{
    const box=$("#"+el.dataset.src);
    el.disabled=true;box.textContent="获取中…";
    if(HOSTED){
      try{const ip=await call("getWanIp",{force:true});state.net.wan=ip;box.textContent=ip;}
      catch(e){box.textContent="获取失败";toast(e.message,false);}
      el.disabled=false;
      return;
    }
    await wait(800);
    box.textContent=state.net.wan;el.disabled=false;
  },
  pair:el=>submitPin(el.dataset.sid),
  web:el=>{
    if(HOSTED){call("openWebUi",{sid:"console",path:el.dataset.path||"/config"});toast("正在打开 Apollo WebUI…");return;}
    toast("预览占位：真实实现里打开 Apollo WebUI 窗口");
  },
  mode:el=>applyMode(el.dataset.mode),
  "res-pick":el=>{state.vda.sel=+el.dataset.i;resRows();},
  "res-add":addRes,
  "res-del":delRes,
  "res-active":activeRes,
  "res-save":saveRes,
  theme:el=>{applyTheme(el.dataset.mode);if(HOSTED)call("setTheme",{mode:el.dataset.mode});toast("主题已切换："+el.textContent.trim());},
  sw:el=>toggleSwitch(el),
  "ports-save":savePorts,
  "cred-apply":applyCred,
  "svc-toggle":toggleService,
  restart:el=>restartSession(el),
  min:minimize,
  close:()=>{
    if(HOSTED){call("windowClose");return;}
    $("#stage").classList.add("closed");
  },
  homepage:()=>{
    if(HOSTED){call("openHomepage");toast("正在打开项目主页…");return;}
    toast("预览占位：不调用外部浏览器");
  },
};

/* ===================== 事件绑定 ===================== */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");
  if(!el||el.disabled)return;
  const fn=ACT[el.dataset.a];
  if(fn)fn(el,e);
});

document.addEventListener("input",e=>{
  const el=e.target;
  if(!el.classList||!el.classList.contains("pinbox"))return;
  el.value=el.value.replace(/\D/g,"").slice(0,1);
  el.classList.toggle("has",el.value.length===1);
  if(!el.value)return;
  const boxes=pinBoxes(el.dataset.sid), i=boxes.indexOf(el);
  if(i<3)boxes[i+1].focus();
});

document.addEventListener("paste",e=>{
  const el=e.target;
  if(!el.classList||!el.classList.contains("pinbox"))return;
  e.preventDefault();
  const code=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,4);
  if(!code)return;
  const boxes=pinBoxes(el.dataset.sid);
  code.split("").forEach((c,i)=>{if(boxes[i]){boxes[i].value=c;boxes[i].classList.add("has");}});
  boxes[Math.min(code.length,3)].focus();
});

document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&!/^[1-5]$/.test(e.key))return;
  if((e.ctrlKey||e.metaKey)&&/^[1-5]$/.test(e.key)){navigate(NAV[+e.key-1].id);e.preventDefault();return;}
  const el=document.activeElement;
  if(!el||!el.classList.contains("pinbox"))return;
  const boxes=pinBoxes(el.dataset.sid), i=boxes.indexOf(el);
  if(e.key==="Backspace"&&!el.value&&i>0){
    boxes[i-1].focus();boxes[i-1].value="";boxes[i-1].classList.remove("has");e.preventDefault();
  }else if(e.key==="Enter"){submitPin(el.dataset.sid);e.preventDefault();}
  else if(e.key==="ArrowLeft"&&i>0)boxes[i-1].focus();
  else if(e.key==="ArrowRight"&&i<3)boxes[i+1].focus();
});

document.addEventListener("dblclick",e=>{
  const row=e.target.closest('[data-a="res-pick"]');
  if(!row)return;
  state.vda.sel=+row.dataset.i;
  resRows();
  activeRes();
});

/* 浏览器特征屏蔽：真实宿主里对应 AreDefaultContextMenusEnabled=false 与 AllowExternalDrop=false */
document.addEventListener("contextmenu",e=>{
  if(e.target.closest("input"))return;
  e.preventDefault();
});
document.addEventListener("dragstart",e=>e.preventDefault());
addEventListener("resize",fit);
lightMQ.addEventListener("change",()=>{if(state.theme==="system")applyTheme("system")});

$("#reopen").addEventListener("click",()=>$("#stage").classList.remove("closed"));

if(HOSTED){
  call("init").then(s=>{applySnapshot(s);pollRemote();})
    .catch(e=>{toast("初始化失败："+e.message,false);call("log",{message:"UI init failed: "+e.message});});
}else{
  render();
  applyTheme(state.theme);
}
</script>
