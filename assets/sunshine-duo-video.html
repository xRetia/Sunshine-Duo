<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunshine-Duo · 一机两用</title>
<style>
  :root{--acc:#2f7cc4;--acc2:#e8833a;--fg:#243447;--mut:#61758c;--line:#d5e2ef}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;color:var(--fg);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(180deg,#f3f7fc,#e7eef7);
    display:flex;flex-direction:column}
  #main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:14px 18px 6px}
  #stageWrap{position:relative;border-radius:14px;overflow:hidden;background:#fdfefe;
    box-shadow:0 10px 34px rgba(45,90,140,.14),0 0 0 1px var(--line)}
  canvas#stage{position:absolute;inset:0;width:100%;height:100%}

  #poster{position:absolute;inset:0;display:flex;flex-direction:column;gap:22px;align-items:center;
    justify-content:center;cursor:pointer;z-index:6;background:rgba(244,248,252,.88);
    backdrop-filter:blur(12px);text-align:center}
  #poster.hide{display:none}
  #poster .bigplay{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--acc);color:#fff;box-shadow:0 10px 30px rgba(47,124,196,.4);transition:transform .18s}
  #poster .bigplay svg{margin-left:6px}
  #poster:hover .bigplay{transform:scale(1.07)}
  #poster h1{margin:0;font-size:21px;font-weight:600;letter-spacing:1px;color:#243447}

  #endcard{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;
    background:rgba(240,246,252,.55);backdrop-filter:blur(3px)}
  #endcard.show{display:flex}
  #replay{width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;color:#fff;
    background:rgba(47,124,196,.94);display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 26px rgba(47,124,196,.4);transition:transform .15s}
  #replay:hover{transform:scale(1.08)}

  #subtitle{position:absolute;left:0;right:0;bottom:7.5%;z-index:4;display:flex;justify-content:center;
    pointer-events:none;padding:0 6%}
  #subtitle .box{background:rgba(30,44,62,.78);border:1px solid rgba(255,255,255,.14);border-radius:10px;
    padding:10px 20px;font-size:clamp(14px,1.6vw,22px);line-height:1.55;color:#f4f8fd;text-align:center;
    max-width:92%;opacity:0;transition:opacity .25s}
  #subtitle.on .box{opacity:1}

  #bar{flex:0 0 58px;height:58px;display:flex;align-items:center;gap:13px;padding:0 20px;
    background:rgba(255,255,255,.92);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
  #bPlay{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;flex:0 0 38px;
    display:flex;align-items:center;justify-content:center;color:#fff;background:var(--acc)}
  #bPlay:hover{background:#286cab}
  #bPlay svg{margin-left:1px}
  #bPlay.paused svg{margin-left:0}
  #rail{flex:1;height:8px;border-radius:5px;background:#dbe6f2;position:relative;cursor:pointer}
  #fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;width:0;
    background:linear-gradient(90deg,#6fa8dc,#2f7cc4)}
  #knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;
    border:3px solid var(--acc);transform:translate(-50%,-50%);display:none;
    box-shadow:0 1px 4px rgba(40,80,120,.3)}
  #ticks{position:absolute;inset:0;pointer-events:none}
  .tick{position:absolute;top:0;bottom:0;width:2px;background:#b6c9dd}
  #tip{position:absolute;bottom:20px;transform:translateX(-50%);display:none;white-space:nowrap;
    background:#243447;color:#eaf2fb;border-radius:8px;padding:5px 11px;font-size:12.5px;
    z-index:3;pointer-events:none}
  #tip b{color:#ffd9a8;font-weight:600}
  #time{color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px;min-width:100px;text-align:center}
  #bMute{width:34px;height:34px;border-radius:50%;border:1px solid #c9d9ea;background:transparent;
    color:#5b83ad;cursor:pointer;flex:0 0 34px;display:flex;align-items:center;justify-content:center}
  #bMute:hover{background:#eef4fa}
  #bMute.off{color:#a4b6c9}
  input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:6px;border-radius:4px;
    background:#dbe6f2;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#fff;border:3px solid var(--acc);cursor:pointer}
</style>
</head>
<body>
<div id="main">
  <div id="stageWrap">
    <canvas id="stage" width="1600" height="900"></canvas>
    <div id="subtitle"><div class="box"></div></div>
    <div id="poster">
      <div class="bigplay"><svg viewBox="0 0 24 24" width="36" height="36"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg></div>
      <h1>Sunshine-Duo · 一机两用</h1>
    </div>
    <div id="endcard"><button id="replay" title="重新播放"></button></div>
  </div>
</div>
<div id="bar">
  <button id="bPlay" title="播放/暂停（空格）"></button>
  <div id="rail"><div id="fill"></div><div id="ticks"></div><div id="knob"></div><div id="tip"></div></div>
  <div id="time">00:00 / 06:22</div>
  <button id="bMute" title="静音（M）"></button>
  <input id="vol" type="range" min="0" max="100" value="65" title="音量">
</div>

<script>
'use strict';
/* ============================================================================
   Sunshine-Duo 项目讲解视频（实时渲染 · 浅色版）
   画面：Canvas 2D 逐帧绘制 | 音乐：Web Audio API 程序化合成
   配音：speechSynthesis(zh-CN) | 分镜脚本 = 每章 subs 数组（字幕/配音共用）
============================================================================ */
const W=1600,H=900,TAU=Math.PI*2;
const cv=document.getElementById('stage'),cx=cv.getContext('2d');
/* 主题色 */
const CB='#5b83ad',CO='#e0913f',CG='#3aa876',CR='#d95f5f',INK='#2c3e55',MUT='#61758c';

/* ---------------- 基础工具 ---------------- */
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function txt(c,s,x,y,size,o){o=o||{};c.save();
  c.globalAlpha*=o.a==null?1:o.a;c.fillStyle=o.col||INK;
  c.font=(o.it?'italic ':'')+(o.w||400)+' '+size+'px '+(o.f||'"Segoe UI","Microsoft YaHei",sans-serif');
  c.textAlign=o.al||'left';c.textBaseline=o.bl||'alphabetic';
  if(s.indexOf('\n')>=0){const ls=o.ls||size*1.4;s.split('\n').forEach((L,i)=>c.fillText(L,x,y+i*ls));}
  else c.fillText(s,x,y);c.restore();}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,p){return a+(b-a)*p;}
function ease(x){return x<0?0:x>1?1:(x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2);}
function outP(p){p=clamp(p,0,1);return 1-Math.pow(1-p,3);}
function fade(tl,a,fi,c,fo){const i=clamp((tl-a)/Math.max(.001,fi),0,1),
  o=1-clamp((tl-c)/Math.max(.001,fo),0,1);return clamp(i*o,0,1);}
function fmt(t){t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}

/* ---------------- 浅色组件 ---------------- */
function bgBase(c,t){
  const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#f8fbfe');g.addColorStop(1,'#e7eef7');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  let g2=c.createRadialGradient(W*.18,-90,40,W*.18,-90,660);
  g2.addColorStop(0,'rgba(120,175,225,.15)');g2.addColorStop(1,'rgba(120,175,225,0)');
  c.fillStyle=g2;c.fillRect(0,0,W*.72,430);
  g2=c.createRadialGradient(W*.9,H+70,60,W*.9,H+70,580);
  g2.addColorStop(0,'rgba(255,175,105,.12)');g2.addColorStop(1,'rgba(255,175,105,0)');
  c.fillStyle=g2;c.fillRect(W*.45,H-450,W*.55,450);}
function card(c,x,y,w,h,o){o=o||{};c.save();
  if(o.a!=null)c.globalAlpha*=o.a;
  rr(c,x,y,w,h,o.r||14);
  c.fillStyle=o.f1||'rgba(255,255,255,.95)';c.fill();
  c.strokeStyle=o.st||'#cfdeee';c.lineWidth=1.5;c.stroke();c.restore();}
function pill(c,cxm,y,label,size,o){o=o||{};
  c.save();c.font=(o.w||600)+' '+size+'px "Segoe UI","Microsoft YaHei",sans-serif';
  const tw=c.measureText(label).width,pad=o.pad||size*.62,w2=tw+pad*2,h=size+pad;
  c.restore();
  c.save();if(o.a!=null)c.globalAlpha*=o.a;
  rr(c,cxm-w2/2,y,w2,h,h/2);
  c.fillStyle=o.col||'rgba(255,255,255,.95)';c.fill();
  c.strokeStyle=o.bd||'#c4d6ea';c.lineWidth=1.3;c.stroke();c.restore();
  txt(c,label,cxm,y+h*.56,size,{al:'center',bl:'middle',w:o.w||600,col:o.tch||'#33475e',a:o.a});
  return w2;}
function badge(c,n,name,tl){
  const a=fade(tl,.25,.45,9999,1);if(a<=0)return;
  c.save();c.globalAlpha*=a;
  rr(c,56,44,344,48,24);c.fillStyle='rgba(255,255,255,.92)';c.fill();
  c.strokeStyle='#c4d6ea';c.lineWidth=1.5;c.stroke();
  txt(c,'第'+n+'章',86,76,19,{col:'#2f7cc4',w:700});
  txt(c,name,170,76,19,{col:'#33475e'});
  c.restore();}
function wm(c){txt(c,'Sunshine-Duo · GPL-3.0 开源',W-40,78,14,{al:'right',col:'rgba(100,125,155,.55)'});}
function docLines(c,x,y,w,n,t,a){
  c.save();c.globalAlpha*=a==null?1:a;
  for(let i=0;i<n;i++){const ab=.3+.4*(.5+.5*Math.sin(t*1.4+i*1.3));
    c.fillStyle='rgba(110,160,215,'+ab.toFixed(2)+')';
    rr(c,x,y+i*24,w*(.55+.3*((i*7)%4)/3),7,3);c.fill();}
  c.restore();}
function dashed(c,x1,y1,x2,y2,tl,col,w){c.save();c.strokeStyle=col||'rgba(90,140,200,.55)';
  c.lineWidth=w||2.5;c.setLineDash([12,10]);c.lineDashOffset=-tl*46;
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.restore();}
function flow(c,x1,y1,x2,y2,tl,rate,offs,col){
  const dx=x2-x1,dy=y2-y1;
  offs.forEach(o=>{const p=((tl*rate+o)%1+1)%1;
    c.fillStyle=(col||'rgba(90,155,220,')+(1-p*.6).toFixed(2)+')';
    c.beginPath();c.arc(x1+dx*p,y1+dy*p,4,0,TAU);c.fill();});}
function ring(c,x,y,r,a,col,w){c.save();c.globalAlpha*=a==null?1:a;c.strokeStyle=col||'#e0913f';
  c.lineWidth=w||3;c.beginPath();c.arc(x,y,r,0,TAU);c.stroke();c.restore();}
function pulseRing(c,x,y,r0,a0,tl,rate,ph,col,grow){
  const k=(tl*rate+ph)%1;c.save();c.globalAlpha*=(1-k)*a0;
  c.strokeStyle=col||'#5a9bd8';c.lineWidth=3;
  c.beginPath();c.arc(x,y,r0+k*(grow||70),0,TAU);c.stroke();c.restore();}
function barMeter(c,x,y,w,h,p,col){c.save();rr(c,x,y,w,h,h/2);c.fillStyle='#e4ecf4';c.fill();
  c.strokeStyle='#c4d6ea';c.lineWidth=1.2;c.stroke();
  if(p>0){rr(c,x+2,y+2,Math.max(0,(w-4)*clamp(p,0,1)),h-4,(h-4)/2);c.fillStyle=col||'#2f7cc4';c.fill();}
  c.restore();}
function check(c,x,y,s,a,col){c.save();c.globalAlpha*=a==null?1:a;
  rr(c,x,y,s,s,s*.25);c.fillStyle=col||'#3aa876';c.fill();
  c.strokeStyle='#f2fbf6';c.lineWidth=s*.14;c.lineCap='round';
  c.beginPath();c.moveTo(x+s*.26,y+s*.52);c.lineTo(x+s*.44,y+s*.7);c.lineTo(x+s*.74,y+s*.3);c.stroke();c.restore();}
function arrowHead(c,x,y,ang,s,col){c.save();c.translate(x,y);c.rotate(ang);
  c.fillStyle=col||'#e0a13f';c.beginPath();c.moveTo(0,0);c.lineTo(-s,-s*.55);c.lineTo(-s,s*.55);
  c.closePath();c.fill();c.restore();}

/* ---------------- 矢量图标库（线条风格，替代 emoji） ---------------- */
const IC={
  monitor(c,s,col){c.fillStyle='rgba(255,255,255,.92)';
    rr(c,-s,-s*.72,2*s,1.44*s,s*.14);c.fill();c.stroke();
    c.beginPath();c.moveTo(0,s*.72);c.lineTo(0,s*.92);
    c.moveTo(-s*.5,s*.92);c.lineTo(s*.5,s*.92);c.stroke();},
  phone(c,s,col){c.fillStyle='rgba(255,255,255,.92)';
    rr(c,-s*.42,-s,s*.84,2*s,s*.16);c.fill();c.stroke();
    c.beginPath();c.moveTo(-s*.1,s*.7);c.lineTo(s*.1,s*.7);c.stroke();},
  pad(c,s,col){c.fillStyle='rgba(255,255,255,.92)';
    rr(c,-s,-s*.42,2*s,s*.84,s*.34);c.fill();c.stroke();
    const k=s*.13;c.fillStyle=col;
    rr(c,-s*.62-k*1.5,-k*.55,k*3,k*1.1,k*.3);c.fill();
    rr(c,-s*.62-k*.55,-k*1.5,k*1.1,k*3,k*.3);c.fill();
    const bx=s*.5,br=s*.1;
    [[0,-s*.2],[0,s*.2],[-s*.2,0],[s*.2,0]].forEach(p=>{
      c.beginPath();c.arc(bx+p[0],p[1],br,0,TAU);c.fill();});},
  shield(c,s,col){c.fillStyle='rgba(255,255,255,.92)';
    c.beginPath();c.moveTo(0,-s);c.lineTo(s*.82,-s*.62);c.lineTo(s*.82,s*.1);
    c.quadraticCurveTo(s*.82,s*.6,0,s);c.quadraticCurveTo(-s*.82,s*.6,-s*.82,s*.1);
    c.lineTo(-s*.82,-s*.62);c.closePath();c.fill();c.stroke();
    c.beginPath();c.moveTo(-s*.3,0);c.lineTo(-s*.05,s*.28);c.lineTo(s*.34,-s*.24);c.stroke();},
  gear(c,s,col){const r=s*.52;c.beginPath();c.arc(0,0,r,0,TAU);c.stroke();
    for(let i=0;i<8;i++){const an=i*TAU/8;
      c.beginPath();c.moveTo(Math.cos(an)*r,Math.sin(an)*r);
      c.lineTo(Math.cos(an)*s*.92,Math.sin(an)*s*.92);c.stroke();}
    c.beginPath();c.arc(0,0,s*.18,0,TAU);c.stroke();},
  key(c,s,col){c.beginPath();c.arc(-s*.42,0,s*.3,0,TAU);c.stroke();
    c.beginPath();c.moveTo(-s*.12,0);c.lineTo(s,0);
    c.moveTo(s*.62,0);c.lineTo(s*.62,s*.3);
    c.moveTo(s*.85,0);c.lineTo(s*.85,s*.38);c.stroke();},
  scale(c,s,col){c.beginPath();c.moveTo(0,-s*.8);c.lineTo(0,s*.6);
    c.moveTo(-s*.55,s*.75);c.lineTo(s*.55,s*.75);c.stroke();
    c.beginPath();c.moveTo(-s*.8,-s*.35);c.lineTo(s*.8,-s*.35);c.stroke();
    [-1,1].forEach(d=>{c.beginPath();c.moveTo(d*s*.8,-s*.35);
      c.lineTo(d*s*.55,s*.18);c.lineTo(d*s*1.05,s*.18);c.closePath();c.stroke();});},
  folder(c,s,col){c.fillStyle='rgba(255,255,255,.92)';
    rr(c,-s*.5,-s*.8,s*.85,s*.36,s*.07);c.fill();c.stroke();
    rr(c,-s,-s*.52,2*s,1.32*s,s*.13);c.fill();c.stroke();},
  lock(c,s,col){c.beginPath();c.arc(0,-s*.28,s*.34,Math.PI,0);c.stroke();
    c.fillStyle='rgba(255,255,255,.92)';
    rr(c,-s*.55,-s*.28,1.1*s,s*.98,s*.14);c.fill();c.stroke();
    c.fillStyle=col;c.beginPath();c.arc(0,s*.12,s*.1,0,TAU);c.fill();},
  warn(c,s,col){c.fillStyle='rgba(255,255,255,.94)';
    c.beginPath();c.moveTo(0,-s);c.lineTo(s*.95,s*.72);c.lineTo(-s*.95,s*.72);c.closePath();c.fill();c.stroke();
    c.beginPath();c.moveTo(0,-s*.3);c.lineTo(0,s*.2);c.stroke();
    c.fillStyle=col;c.beginPath();c.arc(0,s*.46,s*.08,0,TAU);c.fill();},
  x(c,s,col){c.beginPath();c.arc(0,0,s*.85,0,TAU);c.stroke();
    c.beginPath();c.moveTo(-s*.34,-s*.34);c.lineTo(s*.34,s*.34);
    c.moveTo(s*.34,-s*.34);c.lineTo(-s*.34,s*.34);c.stroke();},
  ok(c,s,col){c.beginPath();c.arc(0,0,s*.85,0,TAU);c.stroke();
    c.beginPath();c.moveTo(-s*.36,s*.02);c.lineTo(-s*.08,s*.3);c.lineTo(s*.4,-s*.26);c.stroke();},
  bt(c,s,col){/* 标准蓝牙 ᛒ 形状 */
    c.beginPath();
    c.moveTo(0,-s);c.lineTo(s*.55,-s*.42);c.lineTo(0,0);
    c.lineTo(s*.55,s*.42);c.lineTo(0,s);
    c.moveTo(0,-s);c.lineTo(-s*.55,-s*.42);c.lineTo(0,0);
    c.lineTo(-s*.55,s*.42);c.lineTo(0,s);
    c.moveTo(0,-s);c.lineTo(0,s);
    c.stroke();},
  bolt(c,s,col){c.fillStyle=col;
    c.beginPath();c.moveTo(s*.18,-s);c.lineTo(-s*.5,s*.12);c.lineTo(-s*.06,s*.12);
    c.lineTo(-s*.22,s);c.lineTo(s*.5,-s*.18);c.lineTo(s*.04,-s*.18);c.closePath();c.fill();},
  box(c,s,col){c.fillStyle='rgba(255,255,255,.92)';
    c.beginPath();c.moveTo(0,-s);c.lineTo(s*.9,-s*.5);c.lineTo(0,0);c.lineTo(-s*.9,-s*.5);c.closePath();c.fill();c.stroke();
    c.beginPath();c.moveTo(-s*.9,-s*.5);c.lineTo(-s*.9,s*.5);c.lineTo(0,s);c.lineTo(0,0);c.closePath();c.fill();c.stroke();
    c.beginPath();c.moveTo(s*.9,-s*.5);c.lineTo(s*.9,s*.5);c.lineTo(0,s);c.stroke();},
  img(c,s,col){c.fillStyle='rgba(255,255,255,.92)';
    rr(c,-s,-s*.72,2*s,1.44*s,s*.12);c.fill();c.stroke();
    c.beginPath();c.moveTo(-s*.65,s*.4);c.lineTo(-s*.2,-s*.1);c.lineTo(s*.15,s*.25);
    c.lineTo(s*.4,-s*.05);c.lineTo(s*.68,s*.4);c.stroke();
    c.beginPath();c.arc(-s*.35,-s*.32,s*.13,0,TAU);c.stroke();},
  sig(c,s,col){c.fillStyle=col;
    const xs=[-s*.66,-s*.12,s*.42],hs=[s*.4,s*.75,s*1.1];
    xs.forEach((x,i)=>{rr(c,x,s*.55-hs[i],s*.26,hs[i],s*.08);c.fill();});},
  wifi(c,s,col){for(let i=1;i<=2;i++){c.beginPath();
      c.arc(0,s*.45,s*.55*i,-Math.PI*.78,-Math.PI*.22);c.stroke();}
    c.fillStyle=col;c.beginPath();c.arc(0,s*.5,s*.1,0,TAU);c.fill();},
  eye(c,s,col){c.beginPath();c.moveTo(-s,0);
    c.quadraticCurveTo(0,-s*.95,s,0);c.quadraticCurveTo(0,s*.95,-s,0);c.closePath();c.stroke();
    c.fillStyle=col;c.beginPath();c.arc(0,0,s*.3,0,TAU);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(s*.08,-s*.08,s*.09,0,TAU);c.fill();},
  user(c,s,col){c.beginPath();c.arc(0,-s*.38,s*.3,0,TAU);c.stroke();
    c.beginPath();c.arc(0,s*.75,s*.62,Math.PI*1.15,Math.PI*1.85);c.stroke();},
  crown(c,s,col){c.fillStyle='rgba(255,238,205,.95)';
    c.beginPath();c.moveTo(-s,s*.35);c.lineTo(-s,-s*.25);c.lineTo(-s*.45,s*.05);
    c.lineTo(0,-s*.55);c.lineTo(s*.45,s*.05);c.lineTo(s,-s*.25);c.lineTo(s,s*.35);
    c.closePath();c.fill();c.stroke();},
  bed(c,s,col){c.beginPath();c.moveTo(-s,s*.55);c.lineTo(-s,-s*.45);c.stroke();

/* 全局字幕表（SUBS 由引擎在载入分镜后构建） */
const SUBS=[];
/* ---------------- 引擎：时序 / 音频 / 配音 / 播放器 ---------------- */
let TOTAL=0;for(const sc of SCENES)TOTAL+=sc.dur;
(function(){let acc=0;for(const sc of SCENES){sc.t0=acc;
  for(const s of sc.subs)SUBS.push({t0:acc+s[0],t1:acc+s[1],text:s[2]});
  acc+=sc.dur;}})();
const st={t:0,playing:false,started:false,over:false,cc:true,voice:true,muted:false,vol:.65};
function locate(t){let lo=0;for(let i=0;i<SCENES.length;i++){const sc=SCENES[i];
  if(t<lo+sc.dur)return{sc:sc,tl:t-lo,idx:i};lo+=sc.dur;}
  const last=SCENES[SCENES.length-1];return{sc:last,tl:last.dur-.001,idx:SCENES.length-1};}

/* ---------------- 音频引擎（Web Audio） ---------------- */
const AU={ctx:null,master:null,duckG:null,busG:null,noi:null,
  timer:null,step:0,nextT:0,bpm:92,
  CH:[[57,60,64,67],[53,57,60,64],[55,59,62,67],[48,52,55,59]],
  mf(m){return 440*Math.pow(2,(m-69)/12);},
  ensure(){if(this.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;
    this.ctx=new AC();
    this.duckG=this.ctx.createGain();this.duckG.gain.value=1;
    this.master=this.ctx.createGain();this.master.gain.value=st.muted?0:st.vol;
    this.busG=this.ctx.createGain();this.busG.gain.value=.9;
    this.busG.connect(this.duckG);this.duckG.connect(this.master);
    this.master.connect(this.ctx.destination);
    const len=2*this.ctx.sampleRate,buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),
      d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noi=buf;},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  setVol(v){st.vol=v;if(this.master&&!st.muted)
    this.master.gain.setTargetAtTime(v,this.ctx.currentTime,.05);},
  setMute(m){st.muted=m;if(this.master)
    this.master.gain.setTargetAtTime(m?0:st.vol,this.ctx.currentTime,.05);},
  duck(t,sec){if(this.duckG)this.duckG.gain.setTargetAtTime(t,this.ctx.currentTime,sec||.3);},
  start(){this.ensure();this.resume();this.step=0;this.nextT=this.ctx.currentTime+.08;
    if(!this.timer)this.timer=setInterval(()=>this.tick(),90);},
  stop(){/* 保留 timer；由 playing 门控 */},
  tick(){if(!st.playing)return;const ahead=this.ctx.currentTime+.45;
    while(this.nextT<ahead){this.sched(this.step,this.nextT);this.nextT+=60/this.bpm/2;this.step++;}},
  sched(s,t){const bar=Math.floor(s/8)%4,sb=s%8,ch=this.CH[bar];
    if(sb===0){this.pad(ch,t);this.bass(this.mf(ch[0]-24),t);}
    if(sb===0||sb===4)this.kick(t);
    if(sb%2===1)this.hat(t);
    if(sb===2||sb===6)this.snare(t);
    this.arp(ch,sb,t);
    if(bar===3&&sb===6)this.bell(t);},
  pad(ch,t){const dur=60/this.bpm/2*8*.98,lp=this.ctx.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=820;lp.connect(this.busG);
    for(const m of ch){const f=this.mf(m);
      for(const det of[-6,6]){const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.type='sawtooth';o.frequency.value=f;o.detune.value=det;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.02,t+1.1);
        g.gain.setValueAtTime(.02,t+dur-.8);g.gain.linearRampToValueAtTime(0,t+dur);
        o.connect(g);g.connect(lp);o.start(t);o.stop(t+dur+.05);}}},
  bass(f,t){const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.08);
    g.gain.setValueAtTime(.15,t+1.6);g.gain.linearRampToValueAtTime(0,t+2.3);
    o.connect(g);g.connect(this.busG);o.start(t);o.stop(t+2.4);},
  kick(t){const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(150,t);
    o.frequency.exponentialRampToValueAtTime(42,t+.12);
    g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);
    o.connect(g);g.connect(this.busG);o.start(t);o.stop(t+.2);},
  hat(t){const s=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    s.buffer=this.noi;f.type='highpass';f.frequency.value=6800;
    g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
    s.connect(f);f.connect(g);g.connect(this.busG);s.start(t);s.stop(t+.08);},
  snare(t){const s=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    s.buffer=this.noi;f.type='bandpass';f.frequency.value=1900;f.Q.value=.9;
    g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);
    s.connect(f);f.connect(g);g.connect(this.busG);s.start(t);s.stop(t+.15);},
  arp(ch,sb,t){const pat=[0,1,2,3,2,3,1,2],m=ch[pat[sb]]+12,f=this.mf(m);
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.085,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
    o.connect(g);g.connect(this.busG);o.start(t);o.stop(t+.2);},
  bell(t){const ms=[69,72,76,74,79],m=ms[Math.floor(Math.random()*ms.length)];
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';o.frequency.value=this.mf(m);
    g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.9);
    o.connect(g);g.connect(this.busG);o.start(t);o.stop(t+1);},
  whoosh(){if(!this.ctx)return;const t=this.ctx.currentTime+.02,
    s=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    s.buffer=this.noi;f.type='bandpass';f.Q.value=1.1;
    f.frequency.setValueAtTime(320,t);f.frequency.exponentialRampToValueAtTime(2400,t+.5);
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.28);
    g.gain.exponentialRampToValueAtTime(.001,t+.6);
    s.connect(f);f.connect(g);g.connect(this.duckG);s.start(t);s.stop(t+.65);}

/* ---------------- 配音（speechSynthesis） ---------------- */
const Narr={idx:0,voice:null,
  pick(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();
    this.voice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;},
  say(text){if(!('speechSynthesis' in window))return;
    const u=new SpeechSynthesisUtterance(text);
    if(this.voice){u.voice=this.voice;u.lang=this.voice.lang;}else u.lang='zh-CN';
    u.rate=1.06;u.pitch=1;u.volume=1;
    u.onstart=()=>AU.duck(.38,.25);
    u.onend=()=>AU.duck(1,.6);
    speechSynthesis.speak(u);},
  check(t){if(!st.playing||!st.voice||!('speechSynthesis' in window))return;
    const s=SUBS[this.idx];if(!s)return;
    if(t>=s.t0&&t<s.t1&&!speechSynthesis.speaking&&!speechSynthesis.pending){
      this.say(s.text);this.idx++;}},
  resync(){if('speechSynthesis' in window)speechSynthesis.cancel();
    AU.duck(1,.15);
    let i=SUBS.findIndex(s=>s.t0>st.t);
    if(i<0)this.idx=SUBS.length;else if(i>0&&st.t<SUBS[i-1].t1)this.idx=i-1;else this.idx=i;},
  stop(){if('speechSynthesis' in window)speechSynthesis.cancel();AU.duck(1,.2);}
};
if('speechSynthesis' in window){Narr.pick();
  speechSynthesis.onvoiceschanged=function(){Narr.pick();};}

/* ---------------- 控制条 SVG ---------------- */
const SVG_PLAY='<svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>';
const SVG_PAUSE='<svg viewBox="0 0 24 24" width="20" height="20"><path d="M7.5 5.5h3.4v13H7.5zM13.1 5.5h3.4v13h-3.4z" fill="currentColor"/></svg>';
const SVG_VOL='<svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 9.2v5.6h3.6L13 19V5L7.6 9.2H4z" fill="currentColor"/><path d="M15.8 9a4.4 4.4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M18 6.8a7.6 7.6 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
const SVG_MUTE='<svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 9.2v5.6h3.6L13 19V5L7.6 9.2H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
const SVG_REPLAY='<svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 5a7 7 0 1 1-6.3 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M5 3.5v5.8h5.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------------- UI 引用 ---------------- */
const D=id=>document.getElementById(id);
const eWrap=D('stageWrap'),eSub=D('subtitle'),eSubBox=eSub.querySelector('.box'),
  ePlay=D('bPlay'),eMuteBtn=D('bMute'),eTime=D('time'),eFill=D('fill'),eKnob=D('knob'),
  eRail=D('rail'),eTicks=D('ticks'),eTip=D('tip'),ePoster=D('poster'),eEnd=D('endcard');
ePlay.innerHTML=SVG_PLAY;eMuteBtn.innerHTML=SVG_VOL;D('replay').innerHTML=SVG_REPLAY;

/* 进度条章节刻度 */
SCENES.forEach((sc,i)=>{if(i===0)return;const tk=document.createElement('div');
  tk.className='tick';tk.style.left=(sc.t0/TOTAL*100)+'%';eTicks.appendChild(tk);});

/* ---------------- 播放控制 ---------------- */
function doPlay(){
  if(st.over)doSeek(0);
  if(!st.started){st.started=true;ePoster.classList.add('hide');}
  AU.ensure();AU.resume();AU.start();AU.whoosh();
  st.playing=true;ePlay.innerHTML=SVG_PAUSE;ePlay.classList.remove('paused');
  eEnd.classList.remove('show');
}
function doPause(){if(!st.playing)return;
  st.playing=false;ePlay.innerHTML=SVG_PLAY;ePlay.classList.add('paused');Narr.stop();}
function doSeek(sec){st.t=clamp(sec,0,TOTAL-.001);st.over=false;
  eEnd.classList.remove('show');Narr.resync();}
function togglePlay(){st.playing?doPause():doPlay();}

/* ---------------- 主循环 ---------------- */
let lastTs=0,curSub=-2;
function updUI(){const p=st.t/TOTAL;
  eFill.style.width=(p*100)+'%';
  eKnob.style.left=(p*100)+'%';eKnob.style.display=st.started?'block':'none';
  const L=locate(st.t);
  eTime.textContent=fmt(st.t)+' / '+fmt(TOTAL);
  /* 字幕 */
  let txt2=null;const s=SUBS.find(q=>st.t>=q.t0&&st.t<q.t1);
  if(s)txt2=s.text;
  if(txt2!==curSub){if(txt2){eSubBox.textContent=txt2;eSub.classList.add('on');}
    else eSub.classList.remove('on');
    curSub=txt2;}
}
function render(t){
  const L=locate(t);
  bgBase(cx,t);
  L.sc.draw(cx,t,L.tl);
  /* 章节切换过渡 */
  const remain=L.sc.dur-L.tl;
  let black=0;
  if(L.tl<.35)black=Math.max(black,(0.35-L.tl)/.35*.9);
  if(remain<.45)black=Math.max(black,(0.45-remain)/.45);
  if(black>0){cx.globalAlpha=clamp(black,0,.95);cx.fillStyle='#16233a';
    cx.fillRect(0,0,W,H);cx.globalAlpha=1;}
  wm(cx);
}
function raf(ts){
  requestAnimationFrame(raf);
  if(!lastTs)lastTs=ts;let dt=(ts-lastTs)/1000;lastTs=ts;
  if(dt>.25)dt=.25;
  if(st.playing){st.t+=dt;
    if(st.t>=TOTAL){st.t=TOTAL-.001;doPause();st.over=true;eEnd.classList.add('show');}
  }
  render(st.t);
  Narr.check(st.t);
  updUI();
}
requestAnimationFrame(raf);

/* ---------------- 交互 ---------------- */
eWrap.addEventListener('click',()=>{
  if(!st.started)doPlay();
  else if(st.over){doSeek(0);doPlay();}
  else togglePlay();});
eMuteBtn.addEventListener('click',()=>{AU.ensure();AU.setMute(!st.muted);
  eMuteBtn.innerHTML=st.muted?SVG_MUTE:SVG_VOL;
  eMuteBtn.classList.toggle('off',st.muted);});
D('vol').addEventListener('input',e=>{AU.ensure();
  st.muted=false;eMuteBtn.innerHTML=SVG_VOL;eMuteBtn.classList.remove('off');
  AU.setVol(e.target.value/100);});

/* 进度条拖动与悬停提示 */
let dragging=false;
function railPct(e){const r=eRail.getBoundingClientRect();
  return clamp((e.clientX-r.left)/r.width,0,1);}
eRail.addEventListener('pointerdown',e=>{dragging=true;
  eRail.setPointerCapture(e.pointerId);
  doSeek(railPct(e)*TOTAL);});
eRail.addEventListener('pointermove',e=>{
  const p=railPct(e),t=p*TOTAL,L=locate(t);
  eTip.style.display='block';
  eTip.style.left=(p*100)+'%';
  eTip.innerHTML='<b>'+fmt(t)+'</b> · 第 '+L.sc.n+'章 '+L.sc.name;
  if(dragging)doSeek(t);});
eRail.addEventListener('pointerleave',()=>{eTip.style.display='none';});
eRail.addEventListener('pointerup',e=>{dragging=false;
  doSeek(railPct(e)*TOTAL);});

/* 键盘 */
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(st.started)togglePlay();else doPlay();}
  else if(e.code==='ArrowRight'){doSeek(st.t+5);}
  else if(e.code==='ArrowLeft'){doSeek(st.t-5);}
  else if(e.code==='KeyM'){AU.ensure();AU.setMute(!st.muted);
    eMuteBtn.innerHTML=st.muted?SVG_MUTE:SVG_VOL;
    eMuteBtn.classList.toggle('off',st.muted);}
  else if(e.code==='KeyC'){st.cc=!st.cc;
    eSub.style.display=st.cc?'flex':'none';}
});

/* 画面自适应：16:9 居中 letterbox */
function fit(){const m=D('main');
  const aw=(m&&m.clientWidth)||window.innerWidth-36,
        ah=(m&&m.clientHeight)||window.innerHeight-92;
  const s=Math.max(80,Math.min(aw/16,ah/9));
  const sw=D('stageWrap');
  sw.style.width=(s*16)+'px';sw.style.height=(s*9)+'px';}
window.addEventListener('resize',fit);fit();

/* 调试钩子 */
window.V={st:st,seek:doSeek,play:doPlay,pause:doPause,AU:AU};
/* 截图模式：?t=秒 → 隐藏海报并定位到该时刻 */
(function(){try{const q=new URLSearchParams(location.search);
  if(q.has('t')){st.t=parseFloat(q.get('t'))||0;
    st.started=true;ePoster.classList.add('hide');}}catch(e){}})();
</script>
</body>
</html>
