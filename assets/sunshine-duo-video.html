<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>萌远控Duo · 一台电脑，当两台用</title>
<style>
  :root{
    --bg:#050b16;--line:rgba(132,176,228,.18);
    --tx:#eaf3ff;--tx2:#a6bbd6;--mut:#7188a3;
    --blue:#4ea8ff;--orange:#ff9f45;--green:#3ddc9a;--red:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:var(--bg);color:var(--tx);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column}
  #main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:16px 24px 6px}
  #stageWrap{position:relative;border-radius:16px;overflow:hidden;background:#040a14;
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(120,170,230,.16),0 0 110px rgba(46,110,190,.10)}
  canvas#stage{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- 海报 ---------- */
  #poster{position:absolute;inset:0;z-index:6;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:4% 8%;
    background:radial-gradient(120% 100% at 50% 12%,rgba(18,58,108,.55),rgba(5,11,22,.9) 58%,rgba(4,9,17,.97));
    backdrop-filter:blur(9px);transition:opacity .45s,visibility .45s}
  #poster.hide{opacity:0;visibility:hidden;pointer-events:none}
  .p-kicker{font-size:12.5px;letter-spacing:6px;color:rgba(255,159,69,.92);font-weight:600;margin-bottom:14px}
  .p-orb{margin-bottom:6px;filter:drop-shadow(0 0 26px rgba(255,150,70,.25))}
  .p-title{margin:0;font-size:clamp(30px,4.2vw,58px);font-weight:800;letter-spacing:2px;
    background:linear-gradient(180deg,#ffffff,#c7e3ff 55%,#5fb2ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .p-sub{margin:10px 0 0;font-size:clamp(13px,1.5vw,17px);color:#9db6d3;letter-spacing:.5px}
  .p-play{margin-top:26px;display:flex;align-items:center;gap:14px;padding:9px 24px 9px 9px;border-radius:999px;
    border:1px solid rgba(255,159,69,.4);background:rgba(255,159,69,.10);transition:transform .18s,background .18s}
  #poster:hover .p-play{transform:translateY(-2px);background:rgba(255,159,69,.16)}
  .p-btn{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#ffb268,#f68433);box-shadow:0 10px 30px rgba(246,132,51,.4);color:#fff}
  .p-btn svg{margin-left:3px}
  .p-btn-t{font-size:16px;font-weight:700;color:#ffe3c6;letter-spacing:1px}
  .p-meta{margin-top:22px;font-size:12.5px;color:rgba(150,178,208,.72);letter-spacing:1.5px}
  .p-hint{position:absolute;bottom:22px;left:0;right:0;font-size:11.5px;color:rgba(140,168,198,.55);letter-spacing:1.2px}
  .p-hint b{color:rgba(200,220,240,.8);font-weight:600}

  /* ---------- 字幕 ---------- */
  #subtitle{position:absolute;left:0;right:0;bottom:5.2%;z-index:4;display:flex;justify-content:center;
    pointer-events:none;padding:0 5%}
  #subtitle .box{background:linear-gradient(180deg,rgba(10,20,36,.9),rgba(6,13,24,.94));
    border:1px solid rgba(132,176,228,.22);border-radius:14px;padding:11px 26px;
    font-size:clamp(14px,1.5vw,21px);line-height:1.5;color:#e9f2ff;text-align:center;max-width:100%;
    letter-spacing:.5px;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transform:translateY(4px);
    transition:opacity .25s,transform .25s}
  #subtitle.on .box{opacity:1;transform:none}

  /* ---------- 结束卡 ---------- */
  #endcard{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;gap:12px;
    align-items:center;justify-content:center;background:rgba(4,10,20,.55);backdrop-filter:blur(5px)}
  #endcard.show{display:flex}
  #replay{width:74px;height:74px;border-radius:50%;border:1px solid rgba(255,159,69,.45);cursor:pointer;color:#fff;
    background:linear-gradient(160deg,rgba(255,178,104,.95),rgba(246,132,51,.95));
    box-shadow:0 12px 34px rgba(246,132,51,.35);display:flex;align-items:center;justify-content:center;
    transition:transform .15s}
  #replay:hover{transform:scale(1.06)}
  .e-t{font-size:13px;color:rgba(190,212,235,.8);letter-spacing:2px}

  /* ---------- 控制条 ---------- */
  #bar{flex:0 0 64px;height:64px;display:flex;align-items:center;gap:14px;padding:0 22px;
    background:linear-gradient(180deg,rgba(13,24,41,.96),rgba(7,14,26,.99));
    border-top:1px solid rgba(120,170,230,.14)}
  #bPlay{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;flex:0 0 40px;
    display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(160deg,#ffb268,#f68433);box-shadow:0 4px 16px rgba(246,132,51,.28)}
  #bPlay:hover{filter:brightness(1.08)}
  #bPlay svg{margin-left:1px}
  #rail{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.07);position:relative;cursor:pointer}
  #fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;width:0;
    background:linear-gradient(90deg,#4ea8ff,#ff9f45)}
  #knob{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:#fff;
    border:3px solid #ff9f45;transform:translate(-50%,-50%);display:none;
    box-shadow:0 2px 10px rgba(0,0,0,.5)}
  #ticks{position:absolute;inset:0;pointer-events:none}
  .tick{position:absolute;top:1px;bottom:1px;width:2px;background:rgba(190,215,240,.28)}
  #tip{position:absolute;bottom:22px;transform:translateX(-50%);display:none;white-space:nowrap;
    background:#0b1728;color:#dbe9fa;border:1px solid rgba(132,176,228,.25);border-radius:8px;
    padding:5px 11px;font-size:12px;z-index:3;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.4)}
  #tip b{color:#ffc78e;font-weight:600}
  #time{color:var(--tx2);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:104px;text-align:center;letter-spacing:.5px}
  #bMute,#bFull{width:34px;height:34px;border-radius:50%;border:1px solid rgba(132,176,228,.22);
    background:transparent;color:#9dbddc;cursor:pointer;flex:0 0 34px;
    display:flex;align-items:center;justify-content:center}
  #bMute:hover,#bFull:hover{background:rgba(255,255,255,.06)}
  #bMute.off{color:#5d7590}
  input[type=range]{-webkit-appearance:none;appearance:none;width:104px;height:6px;border-radius:4px;
    background:rgba(255,255,255,.1);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;border:3px solid #ff9f45;cursor:pointer}
  @media(max-width:760px){input[type=range]{display:none}#time{min-width:84px}}
</style>
</head>
<body>
<div id="main">
  <div id="stageWrap">
    <canvas id="stage" width="1600" height="900"></canvas>
    <div id="subtitle"><div class="box"></div></div>

    <div id="poster">
      <div class="p-kicker">萌远控DUO · 产品介绍</div>
      <svg class="p-orb" width="104" height="104" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffd9a8"/><stop offset="1" stop-color="#f0913f"/>
          </linearGradient>
        </defs>
        <g stroke="#ffb063" stroke-width="3" stroke-linecap="round" opacity=".5">
          <line x1="96" y1="60" x2="108" y2="60"/><line x1="91.2" y1="78" x2="101.6" y2="84"/>
          <line x1="78" y1="91.2" x2="84" y2="101.6"/><line x1="60" y1="96" x2="60" y2="108"/>
          <line x1="42" y1="91.2" x2="36" y2="101.6"/><line x1="28.8" y1="78" x2="18.4" y2="84"/>
          <line x1="24" y1="60" x2="12" y2="60"/><line x1="28.8" y1="42" x2="18.4" y2="36"/>
          <line x1="42" y1="28.8" x2="36" y2="18.4"/><line x1="60" y1="24" x2="60" y2="12"/>
          <line x1="78" y1="28.8" x2="84" y2="18.4"/><line x1="91.2" y1="42" x2="101.6" y2="36"/>
        </g>
        <circle cx="60" cy="60" r="26" fill="url(#pg)"/>
        <path d="M88 30a17 17 0 1 0 12 27 14 14 0 0 1-12-27z" fill="#8fb4de" opacity=".9"/>
      </svg>
      <h1 class="p-title">一台电脑，当两台用</h1>
      <p class="p-sub">双会话并行 · 虚拟显示器 · 手柄即插即用 · 外网可连</p>
      <div class="p-play">
        <span class="p-btn"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M8.4 5.6v12.8L18.6 12z" fill="currentColor"/></svg></span>
        <span class="p-btn-t">开始播放</span>
      </div>
      <div class="p-meta">8 章 · 约 6 分钟 · 纯浏览器实时渲染</div>
      <div class="p-hint"><b>空格</b> 播放/暂停　<b>← →</b> 快退/快进　<b>M</b> 静音　<b>F</b> 全屏</div>
    </div>

    <div id="endcard">
      <button id="replay" title="重新播放"></button>
      <div class="e-t">播放结束 · 点击重播</div>
    </div>
  </div>
</div>

<div id="bar">
  <button id="bPlay" title="播放/暂停（空格）"></button>
  <div id="rail"><div id="fill"></div><div id="ticks"></div><div id="knob"></div><div id="tip"></div></div>
  <div id="time">00:00 / 06:01</div>
  <button id="bMute" title="静音（M）"></button>
  <input id="vol" type="range" min="0" max="100" value="62" title="音量">
  <button id="bFull" title="全屏（F）"></button>
</div>

<script>
'use strict';
/* ============================================================================
   萌远控Duo 产品介绍视频
   画面：Canvas 2D 实时渲染 | 音乐：Web Audio 程序化合成 | 配音：speechSynthesis
   8 章脚本 / 字幕 / 配音文本见 SCENES[].subs
============================================================================ */
const W=1600,H=900,TAU=Math.PI*2;
const FONT='"Segoe UI","Microsoft YaHei",system-ui,sans-serif';
const MONO='"Cascadia Mono","Consolas","Courier New",monospace';
const BLUE='#4ea8ff',BLUE2='#2f7cc4',ORANGE='#ff9f45',GREEN='#3ddc9a',RED='#ff6b6b';
const TX='#eaf3ff',TX2='#a6bbd6',MUT='#7188a3';

const cv=document.getElementById('stage'),cx=cv.getContext('2d');

/* ---------------- 基础工具 ---------------- */
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,p){return a+(b-a)*p;}
function ease(x){return x<0?0:x>1?1:(x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2);}
function outP(p){p=clamp(p,0,1);return 1-Math.pow(1-p,3);}
function fade(tl,a,fi,c,fo){const i=clamp((tl-a)/Math.max(.001,fi),0,1),
  o=1-clamp((tl-c)/Math.max(.001,fo),0,1);return clamp(i*o,0,1);}
function en(tl,s,d){d=d||.6;return ease(clamp((tl-s)/d,0,1));}
function ext(tl,e,d){d=d||.5;return 1-ease(clamp((tl-(e-d))/d,0,1));}
function fmt(t){t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}

function txt(c,s,x,y,size,o){o=o||{};c.save();
  c.globalAlpha*=o.a==null?1:o.a;c.fillStyle=o.col||TX;
  c.font=(o.it?'italic ':'')+(o.w||500)+' '+size+'px '+(o.f||FONT);
  c.textAlign=o.al||'left';c.textBaseline=o.bl||'alphabetic';
  if(o.ls!=null&&'letterSpacing' in c)c.letterSpacing=o.ls+'px';
  if(s.indexOf('\n')>=0){const ls=o.lh||size*1.45;s.split('\n').forEach((L,i)=>c.fillText(L,x,y+i*ls));}
  else c.fillText(s,x,y);c.restore();}

/* ---------------- 背景（预渲染） ---------------- */
function mkCanvas(w,h){const k=document.createElement('canvas');k.width=w;k.height=h;return k;}
const baseCv=mkCanvas(W,H);
(function(){const g=baseCv.getContext('2d');
  const lg=g.createLinearGradient(0,0,0,H);
  lg.addColorStop(0,'#08172a');lg.addColorStop(.55,'#061120');lg.addColorStop(1,'#040a14');
  g.fillStyle=lg;g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(110,165,225,.055)';g.lineWidth=1;
  for(let x=40.5;x<W;x+=80){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}
  for(let y=40.5;y<H;y+=80){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  for(let i=0;i<9000;i++){
    g.fillStyle='rgba(255,255,255,'+(Math.random()*.045).toFixed(3)+')';
    g.fillRect(Math.random()*W|0,Math.random()*H|0,1,1);}
})();
function mkBlob(rgb){const k=mkCanvas(900,900),g=k.getContext('2d');
  const rg=g.createRadialGradient(450,450,20,450,450,450);
  rg.addColorStop(0,'rgba('+rgb+',.22)');rg.addColorStop(.45,'rgba('+rgb+',.075)');
  rg.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=rg;g.fillRect(0,0,900,900);return k;}
const blobB=mkBlob('64,140,235'),blobO=mkBlob('255,150,70');
const vigCv=mkCanvas(W,H);
(function(){const g=vigCv.getContext('2d');
  const rg=g.createRadialGradient(W/2,H*.46,H*.18,W/2,H*.5,W*.66);
  rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(.62,'rgba(0,0,0,.16)');
  rg.addColorStop(1,'rgba(0,0,0,.62)');
  g.fillStyle=rg;g.fillRect(0,0,W,H);})();

function drawBG(t){
  cx.drawImage(baseCv,0,0);
  cx.save();cx.globalCompositeOperation='lighter';
  cx.drawImage(blobB,W*.20+Math.sin(t*.06)*60-450,40+Math.cos(t*.05)*30-450,900,900);
  cx.drawImage(blobO,W*.86+Math.cos(t*.045)*55-450,H*.95+Math.sin(t*.05)*35-450,900,900);
  cx.restore();
  for(let i=0;i<44;i++){
    const x=((i*137.5+t*(6+(i%5)*3))%W+W)%W;
    const y=H+70-(((i*211.3+t*(10+(i%7)*4))%(H+110))+110);
    const a=.05+.11*(.5+.5*Math.sin(t*.8+i));
    cx.fillStyle='rgba(150,200,255,'+a.toFixed(3)+')';
    const s=1.4+(i%3)*.7;cx.fillRect(x,y,s,s);
  }
  cx.drawImage(vigCv,0,0);
}

/* ---------------- 组件 ---------------- */
function glow(c,x,y,r,rgb,a){if(!a||a<=0)return;c.save();c.globalAlpha*=a;
  const g=c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba('+rgb+',.42)');g.addColorStop(.55,'rgba('+rgb+',.13)');
  g.addColorStop(1,'rgba('+rgb+',0)');
  c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.restore();}
function panel(c,x,y,w,h,o){o=o||{};const r=o.r==null?18:o.r;
  c.save();if(o.a!=null)c.globalAlpha*=o.a;
  if(o.glow)glow(c,x+w/2,y+h/2,Math.max(w,h)*.78,o.glow,.16);
  rr(c,x,y,w,h,r);
  const g=c.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'rgba(22,38,62,.94)');g.addColorStop(1,'rgba(9,19,35,.96)');
  c.fillStyle=g;c.fill();
  c.strokeStyle=o.hot?'rgba(255,159,69,.85)':'rgba(132,176,228,.18)';
  c.lineWidth=o.hot?1.8:1.2;c.stroke();
  const hg=c.createLinearGradient(x,y,x+w,y);
  hg.addColorStop(0,'rgba(255,255,255,0)');hg.addColorStop(.5,'rgba(255,255,255,.10)');
  hg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=hg;c.fillRect(x+r,y,w-2*r,1);
  c.restore();}
function tag(c,cxm,cy,label,o){o=o||{};
  const size=o.size||16;
  c.save();c.font=(o.w||600)+' '+size+'px '+FONT;
  const tw=c.measureText(label).width,pad=o.pad||size*.78,w=tw+pad*2,h=size+pad*1.2;
  c.restore();
  const x=cxm-w/2,y=cy-h/2;
  c.save();if(o.a!=null)c.globalAlpha*=o.a;
  rr(c,x,y,w,h,h/2);
  c.fillStyle=o.fill||'rgba(255,255,255,.06)';c.fill();
  c.strokeStyle=o.line||'rgba(140,185,235,.28)';c.lineWidth=1.2;c.stroke();
  c.restore();
  txt(c,label,cxm,cy+1,size,{al:'center',bl:'middle',col:o.col||TX2,w:o.w||600,a:o.a,ls:o.ls});
  return w;}
function check(c,x,y,s,a,col){c.save();c.globalAlpha*=a==null?1:a;
  rr(c,x,y,s,s,s*.26);c.fillStyle=col||GREEN;c.fill();
  c.strokeStyle='#04140d';c.lineWidth=s*.15;c.lineCap='round';
  c.beginPath();c.moveTo(x+s*.25,y+s*.52);c.lineTo(x+s*.43,y+s*.7);c.lineTo(x+s*.74,y+s*.28);
  c.stroke();c.restore();}
function docLines(c,x,y,w,n,t,a,col){c.save();c.globalAlpha*=a==null?1:a;
  for(let i=0;i<n;i++){const ab=.24+.32*(.5+.5*Math.sin(t*1.4+i*1.3));
    c.fillStyle=col||('rgba(110,165,230,'+ab.toFixed(2)+')');
    rr(c,x,y+i*26,w*(.55+.3*((i*7)%4)/3),8,4);c.fill();}
  c.restore();}
function dashed(c,x1,y1,x2,y2,tl,col,w,o){o=o||{};c.save();if(o.a!=null)c.globalAlpha*=o.a;
  c.strokeStyle=col||'rgba(110,160,220,.4)';c.lineWidth=w||1.6;
  c.setLineDash([10,9]);c.lineDashOffset=-tl*40;
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.restore();}
function beam(c,x1,y1,x2,y2,tl,o){o=o||{};const a=o.a==null?1:o.a;if(a<=0)return;
  const col=o.col||'90,155,235';
  c.save();c.globalAlpha*=a;
  const g=c.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0,'rgba('+col+',.05)');g.addColorStop(.5,'rgba('+col+',.55)');
  g.addColorStop(1,'rgba('+col+',.05)');
  c.strokeStyle=g;c.lineWidth=o.w||2;
  if(o.dash){c.setLineDash([10,8]);c.lineDashOffset=-tl*42;}
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.setLineDash([]);
  const dx=x2-x1,dy=y2-y1;
  (o.pack||[0,.5]).forEach((p0,i)=>{const p=(((tl*(o.speed||.45)+p0+i*.18)%1)+1)%1;
    c.fillStyle='rgba('+col+','+(1-p*.55).toFixed(2)+')';
    c.beginPath();c.arc(x1+dx*p,y1+dy*p,o.dot||3.2,0,TAU);c.fill();});
  c.restore();}
function pulseRing(c,x,y,r0,a0,tl,rate,ph,col,grow){const k=((tl*rate+ph)%1+1)%1;
  c.save();c.globalAlpha*=(1-k)*a0;
  c.strokeStyle=col||'rgba(255,159,69,.9)';c.lineWidth=2.4;
  c.beginPath();c.arc(x,y,r0+k*(grow||90),0,TAU);c.stroke();c.restore();}
function ring(c,x,y,r,a,col,w){c.save();c.globalAlpha*=a==null?1:a;
  c.strokeStyle=col||ORANGE;c.lineWidth=w||2.5;
  c.beginPath();c.arc(x,y,r,0,TAU);c.stroke();c.restore();}

/* ---------------- HUD / 转场 ---------------- */
function ghost(c,n){txt(c,n,1516,330,300,{al:'right',w:800,col:'rgba(96,150,215,.055)'});}
function hud(c,idx,sc,tl){
  const a=en(tl,.1,.6);if(a<=0)return;
  c.save();c.globalAlpha*=a;
  sunLogo(c,106,64,10,tl,1);
  txt(c,'MENGYUAN DUO',126,69,14.5,{w:700,col:'rgba(226,240,255,.9)',ls:2.6});
  c.fillStyle='rgba(140,185,235,.25)';c.fillRect(304,52,1,22);

function monitor(c,x,y,w,h,o){o=o||{};c.save();
  if(o.a!=null)c.globalAlpha*=o.a;
  if(o.sway)c.translate(Math.sin(o.sway*26)*5,0);
  rr(c,x-12,y-12,w+24,h+24,14);c.fillStyle='rgba(12,25,44,.9)';c.fill();
  c.strokeStyle='rgba(130,180,235,.28)';c.lineWidth=1.4;c.stroke();
  rr(c,x,y,w,h,7);c.fillStyle='#081426';c.fill();
  c.save();rr(c,x,y,w,h,7);c.clip();
  if(o.draw)o.draw(c,x,y,w,h);
  if(o.veil){c.fillStyle='rgba(3,8,16,'+o.veil.toFixed(2)+')';c.fillRect(x,y,w,h);}
  c.restore();
  if(o.stand!==false){c.fillStyle='rgba(120,160,205,.45)';
    c.fillRect(x+w/2-6,y+h+12,12,14);
    rr(c,x+w/2-w*.16,y+h+26,w*.32,8,4);c.fill();}
  c.restore();}

    if(bar===3&&sb===6)this.bell(t);},
  pad(ch,t){const dur=60/this.bpm/2*8*.98,lp=this.ctx.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=760;lp.connect(this.busG);
    for(const m of ch){const f=this.mf(m+this.root);
      for(const det of[-7,7]){const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.type='sawtooth';o.frequency.value=f;o.detune.value=det;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.018,t+1.2);
        g.gain.setValueAtTime(.018,t+dur-.9);g.gain.linearRampToValueAtTime(0,t+dur);
        o.connect(g);g.connect(lp);o.start(t);o.stop(t+dur+.05);}}},
  bass(f,t){const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.13,t+.08);
    g.gain.setValueAtTime(.13,t+1.6);g.gain.linearRampToValueAtTime(0,t+2.3);
    o.connect(g);g.connect(this.busG);o.start(t);o.stop(t+2.4);},
  kick(t){const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(145,t);
    o.frequency.exponentialRampToValueAtTime(42,t+.12);
    g.gain.setValueAtTime(.42,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);
    o.connect(g);g.connect(this.busG);o.start(t);o.stop(t+.2);},
  hat(t){const s=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    s.buffer=this.noi;f.type='highpass';f.frequency.value=7000;
    g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
    s.connect(f);f.connect(g);g.connect(this.busG);s.start(t);s.stop(t+.08);},
  snare(t){const s=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    s.buffer=this.noi;f.type='bandpass';f.frequency.value=1900;f.Q.value=.9;
    g.gain.setValueAtTime(.042,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);
    s.connect(f);f.connect(g);g.connect(this.busG);s.start(t);s.stop(t+.15);},
  arp(ch,sb,t){const pat=[0,1,2,3,2,3,1,2],f=this.mf(ch[pat[sb]]+12+this.root);
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);
    o.connect(g);g.connect(this.busG);o.start(t);o.stop(t+.2);},
  bell(t){const ms=[69,72,76,74,79],m=ms[Math.floor(Math.random()*ms.length)];
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';o.frequency.value=this.mf(m+this.root);
    g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.9);
    o.connect(g);g.connect(this.busG);o.start(t);o.stop(t+1);},
  whoosh(){if(!this.ctx)return;const t=this.ctx.currentTime+.02,
    s=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    s.buffer=this.noi;f.type='bandpass';f.Q.value=1.1;
    f.frequency.setValueAtTime(320,t);f.frequency.exponentialRampToValueAtTime(2400,t+.5);
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.1,t+.28);
    g.gain.exponentialRampToValueAtTime(.001,t+.6);
    s.connect(f);f.connect(g);g.connect(this.duckG);s.start(t);s.stop(t+.65);},
  hit(){if(!this.ctx)return;const t=this.ctx.currentTime+.01;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(112,t);
    o.frequency.exponentialRampToValueAtTime(48,t+.5);
    g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);
    o.connect(g);g.connect(this.duckG);o.start(t);o.stop(t+.75);
    this.whoosh();}
};

/* ---------------- 配音 ---------------- */
const Narr={next:0,voice:null,
  pick(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();
    this.voice=vs.find(v=>/zh[-_]CN/i.test(v.lang)&&/Xiaoxiao|Huihui|Yaoyao|女/i.test(v.name))
      ||vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;},
  say(text){if(!('speechSynthesis' in window))return;
    const u=new SpeechSynthesisUtterance(text);
    if(this.voice){u.voice=this.voice;u.lang=this.voice.lang;}else u.lang='zh-CN';
    u.rate=1.14;u.pitch=1;u.volume=1;
    u.onstart=()=>AU.duck(.45,.2);
    u.onend=()=>AU.duck(1,.5);
    speechSynthesis.speak(u);},
  check(t){if(!st.playing||!('speechSynthesis' in window))return;
    if(speechSynthesis.speaking||speechSynthesis.pending)return;
    if(this.next>=SUBS.length)return;
    const s=SUBS[this.next];
    if(t>=s.t0){this.say(s.text);this.next++;}},
  resync(){if('speechSynthesis' in window)speechSynthesis.cancel();
    AU.duck(1,.15);
    let i=SUBS.findIndex(s=>s.t1>st.t);
    this.next=i<0?SUBS.length:i;},
  stop(){if('speechSynthesis' in window)speechSynthesis.cancel();AU.duck(1,.2);}
};
if('speechSynthesis' in window){Narr.pick();
  speechSynthesis.onvoiceschanged=function(){Narr.pick();};}

/* ---------------- 控制条图标 ---------------- */
const SVG_PLAY='<svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>';
const SVG_PAUSE='<svg viewBox="0 0 24 24" width="20" height="20"><path d="M7.5 5.5h3.4v13H7.5zM13.1 5.5h3.4v13h-3.4z" fill="currentColor"/></svg>';
const SVG_VOL='<svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 9.2v5.6h3.6L13 19V5L7.6 9.2H4z" fill="currentColor"/><path d="M15.8 9a4.4 4.4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M18 6.8a7.6 7.6 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
const SVG_MUTE='<svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 9.2v5.6h3.6L13 19V5L7.6 9.2H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
const SVG_REPLAY='<svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 5a7 7 0 1 1-6.3 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M5 3.5v5.8h5.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SVG_FULL='<svg viewBox="0 0 24 24" width="17" height="17"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------------- UI 引用 ---------------- */
const D=id=>document.getElementById(id);
const eWrap=D('stageWrap'),eSub=D('subtitle'),eSubBox=eSub.querySelector('.box'),
  ePlay=D('bPlay'),eMuteBtn=D('bMute'),eTime=D('time'),eFill=D('fill'),eKnob=D('knob'),
  eRail=D('rail'),eTicks=D('ticks'),eTip=D('tip'),ePoster=D('poster'),eEnd=D('endcard'),eFull=D('bFull');
ePlay.innerHTML=SVG_PLAY;eMuteBtn.innerHTML=SVG_VOL;D('replay').innerHTML=SVG_REPLAY;eFull.innerHTML=SVG_FULL;

SCENES.forEach((sc,i)=>{if(i===0)return;const tk=document.createElement('div');
  tk.className='tick';tk.style.left=(sc.t0/TOTAL*100)+'%';eTicks.appendChild(tk);});

/* ---------------- 播放控制 ---------------- */
function doPlay(){
  if(st.over)doSeek(0);
  if(!st.started){st.started=true;ePoster.classList.add('hide');st.t=0;Narr.resync();}
  AU.ensure();AU.resume();AU.setChapter(locate(st.t).idx);AU.start();AU.whoosh();
  st.playing=true;ePlay.innerHTML=SVG_PAUSE;eEnd.classList.remove('show');
}
function doPause(){if(!st.playing)return;
  st.playing=false;ePlay.innerHTML=SVG_PLAY;Narr.stop();}
function doSeek(sec){st.t=clamp(sec,0,TOTAL-.001);st.over=false;
  eEnd.classList.remove('show');Narr.resync();AU.setChapter(locate(st.t).idx);}
function togglePlay(){st.playing?doPause():doPlay();}

/* ---------------- 渲染 ---------------- */
let lastTs=0,curSub=-2;
function updUI(){const p=clamp(st.t/TOTAL,0,1);
  eFill.style.width=(p*100)+'%';
  eKnob.style.left=(p*100)+'%';eKnob.style.display=st.started?'block':'none';
  eTime.textContent=fmt(st.t)+' / '+fmt(TOTAL);
  let t2=null;const s=SUBS.find(q=>st.t>=q.t0&&st.t<q.t1);
  if(s)t2=s.text;
  if(t2!==curSub){if(t2){eSubBox.textContent=t2;eSub.classList.add('on');}
    else eSub.classList.remove('on');
    curSub=t2;}
}
function render(t){
  const L=locate(t);
  drawBG(t);
  cx.save();
  const cg=1+.008*ease(clamp(L.tl/L.sc.dur,0,1));
  cx.translate(W/2,H/2);cx.scale(cg,cg);cx.translate(-W/2,-H/2);
  ghost(cx,L.sc.n);
  L.sc.draw(cx,t,L.tl);
  cx.restore();
  const hideHud=(L.idx===7&&L.tl>39);
  if(!hideHud)hud(cx,L.idx,L.sc,L.tl);
  slate(cx,L.sc,L.idx,L.tl);
  filmBar();
}
function raf(ts){
  requestAnimationFrame(raf);
  if(!lastTs)lastTs=ts;let dt=(ts-lastTs)/1000;lastTs=ts;
  if(dt>.25)dt=.25;
  if(st.playing){
    st.t+=dt;
    const L=locate(st.t);
    if(L.idx!==st.ch){st.ch=L.idx;AU.setChapter(L.idx);AU.hit();}
    if(st.t>=TOTAL){st.t=TOTAL-.001;doPause();st.over=true;eEnd.classList.add('show');}
  }
  render(st.started?st.t:2.6);
  if(st.started)Narr.check(st.t);
  updUI();
}
requestAnimationFrame(raf);

/* ---------------- 交互 ---------------- */
ePoster.addEventListener('click',e=>{e.stopPropagation();doPlay();});
eWrap.addEventListener('click',()=>{
  if(!st.started)doPlay();
  else if(st.over){doSeek(0);doPlay();}
  else togglePlay();});
ePlay.addEventListener('click',togglePlay);
eMuteBtn.addEventListener('click',()=>{AU.ensure();AU.setMute(!st.muted);
  eMuteBtn.innerHTML=st.muted?SVG_MUTE:SVG_VOL;
  eMuteBtn.classList.toggle('off',st.muted);});
D('vol').addEventListener('input',e=>{AU.ensure();
  st.muted=false;eMuteBtn.innerHTML=SVG_VOL;eMuteBtn.classList.remove('off');
  AU.setVol(e.target.value/100);});
eFull.addEventListener('click',()=>{
  if(document.fullscreenElement)document.exitFullscreen&&document.exitFullscreen();
  else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();});

/* 进度条 */
let dragging=false;
function railPct(e){const r=eRail.getBoundingClientRect();
  return clamp((e.clientX-r.left)/r.width,0,1);}
eRail.addEventListener('pointerdown',e=>{dragging=true;
  eRail.setPointerCapture(e.pointerId);doSeek(railPct(e)*TOTAL);});
eRail.addEventListener('pointermove',e=>{
  const p=railPct(e),t=p*TOTAL,L=locate(t);
  eTip.style.display='block';eTip.style.left=(p*100)+'%';
  eTip.innerHTML='<b>'+fmt(t)+'</b> · 第 '+L.sc.n+' 章 '+L.sc.name;
  if(dragging)doSeek(t);});
eRail.addEventListener('pointerleave',()=>{eTip.style.display='none';});
eRail.addEventListener('pointerup',e=>{dragging=false;doSeek(railPct(e)*TOTAL);});

/* 键盘 */
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(st.started)togglePlay();else doPlay();}
  else if(e.code==='ArrowRight'){doSeek(st.t+5);}
  else if(e.code==='ArrowLeft'){doSeek(st.t-5);}
  else if(e.code==='KeyM'){AU.ensure();AU.setMute(!st.muted);
    eMuteBtn.innerHTML=st.muted?SVG_MUTE:SVG_VOL;
    eMuteBtn.classList.toggle('off',st.muted);}
  else if(e.code==='KeyF'){eFull.click();}
});

/* 自适应 */
function fit(){
  const aw=window.innerWidth-36;
  const ah=window.innerHeight-64-24;
  const s=Math.max(.2,Math.min(aw/16,ah/9));
  eWrap.style.width=(s*16)+'px';eWrap.style.height=(s*9)+'px';}
window.addEventListener('resize',fit);fit();

/* 调试 / 截图 */
window.V={st:st,seek:doSeek,play:doPlay,pause:doPause,AU:AU,scenes:SCENES};
(function(){try{const q=new URLSearchParams(location.search);
  if(q.has('t')){st.t=clamp(parseFloat(q.get('t'))||0,0,TOTAL-.001);
    st.started=true;ePoster.style.transition='none';ePoster.classList.add('hide');}
}catch(e){}})();
</script>
</body>
